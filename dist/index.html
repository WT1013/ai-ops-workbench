function collectImport() {
  const txt = ($('#impText') || {}).value || '';
  const mode = (window.__impMode && window.__impMode()) || 'csv';
  if (!txt.trim()) return { rows: [], err: '内容为空' };
  if (mode === 'json' || /^\s*[\[{]/.test(txt)) {
    try {
      let arr = JSON.parse(txt);
      if (!Array.isArray(arr)) arr = arr.rows || arr.data || [];
      const rows = [], bad = [];
      arr.forEach((o, i) => {
        const r = {};
        Object.keys(o).forEach(k => {
          const kk = HEAD_MAP[k] || k;
          if (kk === 'date') r.date = normDate(o[k]);
          else if (kk === 'shop' || kk === 'note') r[kk] = String(o[k] || '');
          else if (M_KEYS.indexOf(kk) >= 0) r[kk] = num(o[k]);
        });
        if (!r.shop || !r.date) bad.push(i + 1); else rows.push(r);
      });
      return { rows, bad };
    } catch (e) { return { rows: [], err: 'JSON 解析失败：' + e.message }; }
  }
  return parseTable(txt);
}

function previewImport() {
  const box = $('#impPrev'); if (!box) return;
  const r = collectImport();
  if (r.err) { box.innerHTML = `<span class="bad">${esc(r.err)}</span>`; return; }
  if (!r.rows.length) { box.innerHTML = `<span class="bad">没有可导入的行</span>`; return; }
  const shops = new Set(r.rows.map(x => x.shop));
  const dates = Array.from(new Set(r.rows.map(x => x.date))).sort();
  const exist = r.rows.filter(x => store.list('metrics').some(m => m.shop === x.shop && m.date === x.date)).length;
  box.innerHTML = `可导入 <b>${r.rows.length}</b> 条 · 涉及 <b>${shops.size}</b> 家店 ·
    日期 <b>${esc(dates[0])}</b> → <b>${esc(dates[dates.length - 1])}</b><br>
    新增 <b class="ok">${r.rows.length - exist}</b> 条 · 覆盖 <b>${exist}</b> 条
    ${r.bad && r.bad.length ? ` · <span class="bad">${r.bad.length} 行缺店铺或日期已跳过（第 ${r.bad.slice(0, 5).join('、')} 行）</span>` : ''}`;
}

function doImport(close) {
  const r = collectImport();
  if (r.err || !r.rows.length) { toast(r.err || '没有可导入的行', 'bad'); return; }
  let ins = 0, upd = 0, newShops = 0;
  const known = new Set(store.list('shops').map(s => s.name));
  r.rows.forEach(x => {
    if (!known.has(x.shop)) {
      store.add('shops', {
        name: x.shop, platform: '未分类', account: '', owner: '未分配',
        tag: '常规', auth: '未授权', opstat: '运营中', third: '', note: '由指标导入自动建档，待补全'
      });
      known.add(x.shop); newShops++;
    }
    const t = store.upsertMetric(x);
    t === 'insert' ? ins++ : upd++;
  });
  store.save();
  if (store.db.meta && store.db.meta.seed) { store.db.meta = { seed: false }; store.save(); }
  close();
  toast(`导入完成：新增 ${ins} · 覆盖 ${upd}${newShops ? ` · 新建店铺 ${newShops}` : ''}`, 'ok');
  render();
}

/* ---------- 表格单元格内联编辑（点一下就能改，像 Excel） ----------
   用法：<td class="cell" data-cell="集合:记录id:字段" data-type="num" data-maxlen="4"> */
function openCellEdit(cell) {
  if (!canEdit()) { denyWrite(); return; }
  const parts = String(cell.dataset.cell || '').split(':');
  if (parts.length < 3) return;
  const coll = parts[0], id = parts[1], field = parts[2];
  const rec = store.get(coll, id);
  if (!rec) { toast('这条记录已被删除，刷新一下', 'bad'); return; }

  const isNum = cell.dataset.type === 'num';
  const maxlen = +(cell.dataset.maxlen || 0);
  const oldVal = rec[field] == null ? '' : String(rec[field]);

  const inp = document.createElement('input');
  inp.className = 'cell-inp';
  inp.value = oldVal;
  if (isNum && field !== 'tail') inp.type = 'number';
  if (maxlen) inp.maxLength = maxlen;
  cell.classList.add('editing');
  cell.textContent = '';
  cell.appendChild(inp);
  inp.focus();
  inp.select();

  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    let changed = false;
    if (save) {
      let v = inp.value.trim();
      if (maxlen) v = v.replace(/\D/g, '').slice(0, maxlen);
      let val = v;
      if (isNum) {
        if (v === '') val = null;
        else {
          val = num(v);
          if (val == null) { toast('这里只能填数字', 'bad'); }
        }
      }
      if (String(oldVal) !== String(val == null ? '' : val)) {
        store.update(coll, id, { [field]: val });
        changed = true;
      }
    }
    cell.classList.remove('editing');
    render();
    if (changed) toast('已保存 · 全组可见', 'ok');
  };

  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}

/* ---------- 图表 ---------- */
const C = { w: 760, h: 242, pl: 38, pr: 60, pt: 18, pb: 30 };
let chartData = [];

function buildChart(series) {
  if (!series.length) return `<div class="empty-block" style="margin:4px 0"><b>还没有指标数据</b>点右上「导入指标」粘贴 OMS 导出的表格，或手动录入一条</div>`;
  const vals = [];
  series.forEach(s => { [s.adopt, s.gen].forEach(v => { if (v != null) vals.push(v); }); });
  const T = store.cfg.targets;
  const tvals = vals.concat([T.adopt, T.gen]);
  let lo = Math.floor((Math.min.apply(null, tvals) - 2) / 4) * 4;
  let hi = Math.ceil((Math.max.apply(null, tvals) + 2) / 4) * 4;
  if (hi - lo < 8) hi = lo + 8;

  const iw = C.w - C.pl - C.pr, ih = C.h - C.pt - C.pb;
  const x = i => C.pl + (series.length === 1 ? iw / 2 : (iw / (series.length - 1)) * i);
  const y = v => C.pt + ih - ((v - lo) / (hi - lo)) * ih;

  const path = arr => arr.map((v, i) => v == null ? '' : `${i ? 'L' : 'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).filter(Boolean).join(' ');

  let gl = '';
  let step = (hi - lo) / 6;
  step = [1, 2, 2.5, 5, 10, 20].find(s => s >= step - 0.001) || 20;
  for (let v = lo; v <= hi + 0.001; v += step) {
    if (Math.abs(v - Math.round(v)) > 0.001) continue;
    gl += `<line class="gl${v === lo ? ' zero' : ''}" x1="${C.pl}" y1="${y(v)}" x2="${C.w - C.pr}" y2="${y(v)}"/>
      <text x="${C.pl - 8}" y="${y(v) + 3.5}" text-anchor="end">${Math.round(v)}</text>`;
  }
  const skip = Math.ceil(series.length / 7);
  let xl = '';
  series.forEach((s, i) => {
    if (i % skip === 0 || i === series.length - 1) {
      xl += `<text x="${x(i)}" y="${C.h - 8}" text-anchor="middle">${esc(s.date.slice(5))}</text>`;
    }
  });

  const adopt = series.map(s => s.adopt), gen = series.map(s => s.gen);
  const lastI = series.length - 1;
  const dots = (arr, color) => arr.map((v, i) => v == null ? '' : `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="${series.length > 20 ? 1.6 : 2.2}" fill="${color}"/>`).join('');

  const tl = (v) => `<line class="target" x1="${C.pl}" y1="${y(v)}" x2="${C.w - C.pr}" y2="${y(v)}"/>`;

  const hover = series.map((s, i) => {
    const w = series.length > 1 ? iw / (series.length - 1) : iw;
    return `<rect class="hv" data-i="${i}" x="${x(i) - w / 2}" y="${C.pt}" width="${w}" height="${ih}" fill="transparent"/>`;
  }).join('');

  chartData = series;

  return `<svg class="chart" viewBox="0 0 ${C.w} ${C.h}" role="img" aria-label="采纳率与生成率趋势">
    <g class="axis">${gl}${xl}</g>
    ${isIn(T.gen, lo, hi) ? tl(T.gen) : ''}
    ${isIn(T.adopt, lo, hi) ? tl(T.adopt) : ''}
    <path class="line-b" d="${path(gen)}"/>
    <path class="line-a" d="${path(adopt)}"/>
    ${dots(gen, 'var(--info)')}
    ${dots(adopt, 'var(--amber)')}
    ${adopt[lastI] != null ? `<text class="endlabel" x="${C.w - C.pr + 6}" y="${y(adopt[lastI]) - 6}" fill="var(--amber)">${f1(adopt[lastI])}%</text>` : ''}
    ${gen[lastI] != null ? `<text class="endlabel" x="${C.w - C.pr + 6}" y="${y(gen[lastI]) + 12}" fill="var(--info)">${f1(gen[lastI])}%</text>` : ''}
    <line id="cross" x1="0" y1="${C.pt}" x2="0" y2="${C.pt + ih}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3" opacity="0"/>
    <g id="hits">${hover}</g>
  </svg>`;
}

  ${alerts.length ? `<div class="alist">${rows}</div>` : emptyBlock('没有待处理预警', '所有预警都已处理完', 'alerts', '上报预警')}

  <div class="block-title" style="margin-top:26px">今日洞察 · 规则自动推导</div>
  ${insHtml}`;
}

/* ---------- 页面：数据看板 ---------- */
function renderBoard() {
  const series = agg.series(store.cfg.range);
  const stats = agg.sixStats();
  const T = store.cfg.targets;

  const six = table(
    [{ t: '指标' }, { t: '近 7 天', n: 1 }, { t: '前 7 天', n: 1 }, { t: '环比', n: 1 }, { t: '状态' }, { t: '目标' }],
    stats.map(s => {
      const d = (s.cur != null && s.prev != null) ? +(s.cur - s.prev).toFixed(1) : null;
      const dir = d == null ? 'flat' : d > 0 ? (s.def.hi ? 'up' : 'down') : (s.def.hi ? 'down' : 'up');
      const tgt = s.def.tgt ? T[s.def.tgt] : null;
      let st = '—', cls = 'mute';
      if (tgt != null && s.cur != null) {
        const ok = s.def.hi ? s.cur >= tgt : s.cur <= tgt;
        st = ok ? '达标' : '未达标'; cls = ok ? 'ok' : 'p0';
      }
      return [
        s.def.l,
        s.cur == null ? '—' : f1(s.cur),
        s.prev == null ? '—' : f1(s.prev),
        { html: d == null ? '<span style="color:var(--ink3)">—</span>' : `<span class="delta ${dir}">${d > 0 ? '+' : ''}${d} pt</span>` },
        { html: chipP(st, cls) },
        tgt == null ? '—' : tgt + '%'
      ];
    })
  );

  const dates = agg.dates();
  const scope = dates.length ? `${esc(dates[dates.length - 1])} → ${esc(dates[0])}` : '无数据';

  return `
  <div class="sec-head">
    <h2>数据看板</h2>
    <span class="sub">${scope} · ${agg.shopNames().length} 家店 · 指标由原始记录实时聚合</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn" data-import>${ICON.down} 导入指标</button>
      <button class="btn primary" data-new="metrics">${ICON.plus} 录入指标</button>
    </div>
  </div>
  ${cfgBar()}

  <div class="card pad">
    <div class="chart-head">
      <div>
        <div style="font-size:13px;font-weight:500">采纳率 / 生成率 · 近 ${store.cfg.range} 天</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px">虚线为目标值 · 每点为当日全组均值</div>
      </div>
      <div class="legend">
        <span><i style="background:var(--amber)"></i>采纳率</span>
        <span><i style="background:var(--info)"></i>生成率</span>
        <span><i class="dash"></i>目标 ${T.adopt} / ${T.gen}</span>
      </div>
    </div>
    <div class="chart-wrap" id="chartWrap">
      ${buildChart(series)}
      <div class="tip" id="tip"></div>
    </div>
    ${series.length ? `<div class="readout" id="readout"></div>` : ''}
  </div>

  <div class="block-title" style="margin-top:24px">六项核心指标 · 近 7 天 vs 前 7 天</div>
  ${six}

  <div class="block-title" style="margin-top:24px">单店下钻</div>
  <div id="drillBox"></div>`;
}

function renderDrill() {
  const box = $('#drillBox'); if (!box) return;
  /* 下钻只列「有指标记录」的店，92 家全列出来没意义 */
  const withData = agg.shopNames().filter(n => store.list('metrics').some(m => m.shop === n));
  const shops = withData.length ? withData : agg.shopNames();
  if (!shops.length) { box.innerHTML = emptyBlock('还没有店铺', '先到店铺库新增店铺，再录入指标', 'shops', '新增店铺'); return; }
  const sel = window.__drillShop && shops.indexOf(window.__drillShop) >= 0 ? window.__drillShop : shops[0];
  window.__drillShop = sel;
  const recs = store.list('metrics').filter(m => m.shop === sel).sort((a, b) => a.date < b.date ? 1 : -1);
  const last = recs[0];
  const T = store.cfg.targets;

  const m = METRICS.map(def => {
    const v = last ? num(last[def.k]) : null;
    const tgt = def.tgt ? T[def.tgt] : null;
    let color = '';
    if (v != null && tgt != null) color = (def.hi ? v < tgt : v > tgt) ? 'color:var(--bad)' : 'color:var(--good)';
    return `<div><div class="v" style="${color}">${v == null ? '—' : f1(v) + '%'}</div><div class="l">${def.l}${tgt != null ? ' · 目标 ' + tgt : ''}</div></div>`;
  }).join('');

  const spark = recs.slice(0, store.cfg.range).reverse();
  const sp = spark.length > 1 ? (() => {
    const vals = spark.map(r => num(r.adopt)).filter(v => v != null);
    if (!vals.length) return '';
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const w = 220, h = 34;
    const pts = spark.map((r, i) => {
      const v = num(r.adopt); if (v == null) return null;
      const px = (i / (spark.length - 1)) * w;
      const py = hi === lo ? h / 2 : h - ((v - lo) / (hi - lo)) * h;
      return `${px.toFixed(1)},${py.toFixed(1)}`;
    }).filter(Boolean).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:220px;height:34px;display:block" aria-hidden="true">
      <polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="1.6"/></svg>`;
  })() : '';

  const breach = agg.breaches().filter(b => b.shop === sel);

  box.innerHTML = `
    <div class="toolbar">
      <div class="seg" id="drillTabs">
        ${shops.length > 10
          ? `<select id="drillSel" style="min-width:220px">${shops.map(s => `<option ${s === sel ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>`
          : shops.map(s => `<button data-drill="${esc(s)}" class="${s === sel ? 'on' : ''}">${esc(s)}</button>`).join('')}
      </div>
    </div>
    ${last ? `
    <div class="mini-kpis four">${m}</div>
    <div style="display:flex;align-items:center;gap:14px;margin:14px 0 8px;flex-wrap:wrap">
      <div class="block-title" style="margin:0;flex:1">采纳率近 ${spark.length} 天</div>
      ${sp}
      <span style="font-family:var(--mono);font-size:11px;color:var(--ink3)">最新记录 ${esc(last.date)}</span>
      <button class="btn sm" data-new="metrics">补录</button>
    </div>
    ${breach.length ? table([{ t: '未达标指标' }, { t: '当前', n: 1 }, { t: '目标', n: 1 }, { t: '差值', n: 1 }],
      breach.map(b => [b.metric, { html: f1(b.v) }, b.tgt, { html: `<span class="delta ${b.gap < 0 ? 'down' : 'up'}">${b.gap > 0 ? '+' : ''}${b.gap} pt</span>` }]))
      : `<div class="note" style="color:var(--good)">该店所有设目标指标均已达标</div>`}
    ` : emptyBlock('该店还没有指标记录', '导入或录入后显示', 'metrics', '录入指标')}`;
}

/* ---------- 页面：店铺库（平台分组 · 缺口筛选 · 行内账号） ---------- */
const PLAT_ORDER = ['拼多多', '天猫', '京东', '抖音', '其他'];
const uiState = () => (window.__sb = window.__sb || { open: {}, acctOpen: {} });

      <td class="mono tail-cell cell" data-cell="accounts:${esc(a.id)}:tail" data-type="num" data-maxlen="4" title="点击直接改">${a.tail ? esc(a.tail) : '<span class="dim">••••</span>'}</td>
      <td class="cell" data-cell="accounts:${esc(a.id)}:owner" title="点击直接改">${esc(a.owner || '—')}</td>

      <td class="cell" data-cell="accounts:${esc(a.id)}:note" title="点击直接改">${esc(a.note || '—')}</td>

    </tr>`).join('')
    : `<tr><td colspan="9" class="acct-empty">这家店还没有账号 —— 点右上「新增账号」，按 角色 / 登录账号 / 绑定人 / 尾号 逐项填第一条</td></tr>`;

      <span class="acct-title">账号汇总</span>
      <span class="acct-flag">${accts.length} 个账号</span>
      <div style="margin-left:auto"><button class="btn sm primary" data-new="accounts" data-pre-shop="${esc(s.name)}">${ICON.plus} 新增账号</button></div>
    </div>
    <div class="acct-sub">账号只记「绑定人 + 手机后四位」，工作台不保存登录密码。</div>
    <div class="tbl-wrap"><table class="acct-tbl">
      <thead><tr><th>角色</th><th>登录账号</th><th>绑定人</th><th>尾号</th><th>使用人</th><th>岗位</th><th>状态</th><th>备注</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function renderStores() {
  const shops = store.list('shops');
  const acctMap = agg.accountsByShop();
  const st = uiState();

  const f = window.__storeFilter || 'all';
  const q = (window.__storeQ || '').trim().toLowerCase();

  const acctsOf = s => acctMap[s.name] || [];
  const hasAcct = s => acctsOf(s).length > 0;
  const hasOwner = s => !!(s.owner || '').trim();

  /* 店铺库只看「店 + 账号」口径，不参与采纳率等经营指标判定 */
  const statusOf = s => {
    if (s.tag === '历史' || s.opstat === '已下架') return { t: '已下架', c: 'mute' };
    if (s.auth === '未授权' || s.auth === '已失效') return { t: s.auth, c: 'p1' };
    if (!hasOwner(s)) return { t: '缺负责人', c: 'p1' };
    if (!hasAcct(s)) return { t: '缺账号', c: 'p1' };
    return { t: '正常', c: 'ok' };
  };

  const sorted = shops.slice().sort((a, b) => {
    const oa = a.order == null || a.order === '' ? 9999 : +a.order;
    const ob = b.order == null || b.order === '' ? 9999 : +b.order;
    return oa !== ob ? oa - ob : String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
  });

  const list = sorted.filter(s => {
    if (f === 'key' && s.tag !== '重点') return false;
    if (f === 'history' && s.tag !== '历史') return false;
    if (f === 'live' && s.tag === '历史') return false;
    if (f === 'noacct' && hasAcct(s)) return false;
    if (f === 'noowner' && hasOwner(s)) return false;
    if (q) {
      const hay = [s.name, s.platform, s.owner, s.binder, acctsOf(s).map(a => a.login || '').join(' ')]
        .join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  const groups = {};
  list.forEach(s => { const p = s.platform || '其他'; (groups[p] = groups[p] || []).push(s); });
  const gKeys = Object.keys(groups).sort((a, b) => {
    const ia = PLAT_ORDER.indexOf(a), ib = PLAT_ORDER.indexOf(b);
    return ((ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)) || a.localeCompare(b, 'zh-Hans-CN');
  });

  const forceOpen = !!q || f !== 'all';
  const anyOpen = Object.keys(st.open).some(k => st.open[k]);

  const rowsOf = items => items.map(s => {
    const stt = statusOf(s);
    const accts = acctsOf(s);
    const open = !!st.acctOpen[s.name];
    let out = `<tr class="srow${open ? ' is-open' : ''}">
      <td class="s-name">
        <button type="button" class="s-toggle" data-acct="${esc(s.name)}" aria-expanded="${open}">
          <span class="caret">${ICON.chev}</span><span class="nm">${esc(s.name)}</span>
          ${s.tag === '重点' ? '<span class="chip amber">重点</span>' : ''}
          ${s.tag === '历史' ? `<span class="chip mute" title="${esc(s.note || '')}">历史</span>` : ''}
        </button>
        ${accts.length ? `<span class="acct-flag">账号 ${accts.length}</span>` : ''}
      </td>
      <td>${chipP(stt.t, stt.c)}</td>
      <td class="cell" data-cell="shops:${esc(s.id)}:owner" title="点击直接改">${hasOwner(s) ? esc(s.owner) : '<span class="dim">点此填写</span>'}</td>
      <td class="cell" data-cell="shops:${esc(s.id)}:binder" title="点击直接改">${s.binder ? esc(s.binder) : '<span class="dim">点此填写</span>'}</td>
      <td class="n mono">${accts.length ? '<b style="font-weight:500">' + accts.length + '</b>' : '<span class="dim">—</span>'}</td>
      <td class="n">${acts('shops', s.id)}</td>
    </tr>`;
    if (open) out += `<tr class="acct-detail"><td colspan="6">${acctPanel(s, accts)}</td></tr>`;
    return out;
  }).join('');

  const body = gKeys.map(p => {
    const items = groups[p];
    const kc = items.filter(s => s.tag === '重点').length;
    const rc = items.filter(hasAcct).length;
    const missAcct = items.filter(s => !hasAcct(s)).length;
    const open = forceOpen || !!st.open[p];
    return `<section class="sgroup${open ? ' open' : ''}" data-platform="${esc(p)}">
      <div class="sg-head" data-group="${esc(p)}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="sg-caret">${ICON.chev}</span>
        <span class="sg-name">${esc(p)}</span>
        <span class="sg-meta">
          <span class="sg-pill">${items.length} 家</span>
          ${kc ? `<span class="sg-pill key">重点 ${kc}</span>` : ''}
          <span class="sg-pill">已建账号 ${rc}</span>
          ${missAcct ? `<span class="sg-pill warn">缺账号 ${missAcct}</span>` : ''}
        </span>
      </div>
      <div class="sg-body">
        <div class="tbl-wrap"><table class="store-tbl">
          <thead><tr><th>店铺</th><th>状态</th><th>负责人</th><th>绑定人</th><th class="n">账号</th><th></th></tr></thead>
          <tbody>${rowsOf(items)}</tbody>
        </table></div>
      </div>
    </section>`;
  }).join('');

  const total = shops.length;
  const histN = shops.filter(s => s.tag === '历史').length;
  const liveN = total - histN;
  const liveShops = shops.filter(s => s.tag !== '历史');
  const keyN = liveShops.filter(s => s.tag === '重点').length;
  const noAcctN = liveShops.filter(s => !hasAcct(s)).length;
  const noOwnerN = liveShops.filter(s => !hasOwner(s)).length;
  /* 缺口按平台拆开，一眼看出是「某平台整体未接入」还是个别漏填 */
  const mixBy = pred => {
    const m = {};
    liveShops.filter(pred).forEach(s => { const p = s.platform || '其他'; m[p] = (m[p] || 0) + 1; });
    return Object.keys(m)
      .sort((a, b) => ((PLAT_ORDER.indexOf(a) < 0 ? 99 : PLAT_ORDER.indexOf(a)) - (PLAT_ORDER.indexOf(b) < 0 ? 99 : PLAT_ORDER.indexOf(b))))
      .map(p => `${p} ${m[p]}`).join(' · ');
  };
  const noOwnerMix = mixBy(s => !hasOwner(s));
  const noAcctMix = mixBy(s => !hasAcct(s));
  const acctAll = store.list('accounts');
  const acctN = acctAll.length;
  const acctStopN = acctAll.filter(a => a.status === '停用').length;

  const tabs = [
    { k: 'all', l: '全部', n: total },
    { k: 'live', l: '在营', n: liveN },
    { k: 'key', l: '重点', n: keyN },
    { k: 'history', l: '历史/关店', n: histN },
    { k: 'noacct', l: '缺账号', n: noAcctN },
    { k: 'noowner', l: '缺负责人', n: noOwnerN }
  ];

  const owners = agg.owners().map(o => {
    const own = shops.filter(s => s.owner === o);
    const ownLive = own.filter(s => s.tag !== '历史');
    const tasks = store.list('tasks').filter(t => t.owner === o && t.status !== '已完成').length;
    return `<div class="owner">
      <div class="hd"><div class="av">${esc(o.slice(0, 1))}</div>
        <div><div class="nm">${esc(o)}</div><div class="rl">负责店铺</div></div></div>
      <div class="row2">
        <div><span>${own.length}</span><em>家店</em></div>
        <div><span>${own.filter(s => s.tag === '重点').length}</span><em>重点</em></div>
        <div><span>${ownLive.filter(s => !hasAcct(s)).length}</span><em>缺账号</em></div>
        <div><span>${tasks}</span><em>待办</em></div>
      </div></div>`;
  }).join('');

  return `
  <div class="sec-head">
    <h2>店铺库</h2>
    <span class="sub">${liveN} 家在营 · ${histN} 家历史/关店 · 账号 ${acctN} 条 · 缺账号 ${noAcctN} · 缺负责人 ${noOwnerN}</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn" data-go="assets">资产库 ${store.list('assets').length} 份 →</button>
      <button class="btn primary" data-new="shops">${ICON.plus} 新增店铺</button>
    </div>
  </div>

  <div class="vault">
    <div class="vault-l">
      <span class="vault-ic">${ICON.lock}</span>
      <div>
        <b>账号信息 · 只记绑定人与尾号</b>
        <span class="vault-t">${acctN} 条账号 · ${acctStopN} 条已停用。工作台不再保存登录密码，账号名下只留绑定人与其手机号后四位，团队共用时可对照核对。</span>
      </div>
    </div>
    <div class="vault-r">
      <button class="btn sm" data-new="accounts">${ICON.plus} 补一条账号</button>
    </div>
  </div>

  <div class="store-stats">
    <div class="ss"><em>在营店铺</em><b>${liveN}</b><i>${gKeys.length} 个平台 · 历史 ${histN}</i></div>
    <div class="ss"><em>重点店铺</em><b>${keyN}</b><i>需重点跟进</i></div>
    <div class="ss"><em>账号总数</em><b>${acctN}</b><i>覆盖 ${Object.keys(acctMap).length} 家店</i></div>
    <div class="ss ${noAcctN ? 'warn' : ''}"><em>缺账号</em><b>${noAcctN}</b><i>${noAcctMix || '登录信息待补'}</i></div>
    <div class="ss ${noOwnerN ? 'warn' : ''}"><em>缺负责人</em><b>${noOwnerN}</b><i>${noOwnerMix || '待指派'}</i></div>
  </div>

  <div class="toolbar">
    <div class="seg" id="storeTabs">
      ${tabs.map(t => `<button data-f="${t.k}" class="${f === t.k ? 'on' : ''}">${t.l}<b>${t.n}</b></button>`).join('')}
    </div>
    <label class="search">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input id="storeSearch" placeholder="搜索店铺 / 负责人 / 账号" value="${esc(window.__storeQ || '')}" />
    </label>
    ${forceOpen ? '' : `<button class="btn sm" data-expand="${anyOpen ? 'none' : 'all'}">${anyOpen ? '收起全部' : '展开全部'}</button>`}
    <div style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)">显示 ${list.length} / ${total} 家</div>
  </div>

  ${gKeys.length ? body : emptyBlock('没有匹配的店铺', '换个关键词或筛选条件试试')}

  <div class="block-title" style="margin-top:26px">负责人聚合 · ${agg.owners().length} 位</div>
  <div class="owners">${owners || emptyBlock('还没有负责人', '编辑店铺时填写负责人')}</div>`;
}

/* ---------- 页面：资产库 ---------- */
const ASSET_TYPES = ['话术模板', '知识切片', '词表', '配置', '业务流程', 'AI 技能', '其他'];

function renderAssets() {
  const all = store.list('assets');
  const f = window.__assetF || 'all';
  const q = (window.__assetQ || '').trim().toLowerCase();

  const cnt = t => all.filter(a => (a.type || '其他') === t).length;
  const byState = s => all.filter(a => (a.status || '草稿') === s).length;
  const live = byState('已生效'), draft = byState('草稿'), arch = byState('已归档');

  let list = all.slice();
  if (f !== 'all') list = list.filter(a => (a.type || '其他') === f);
  if (q) list = list.filter(a => [a.name, a.type, a.cat, a.shop, a.owner, a.note, a.url]
    .join(' ').toLowerCase().indexOf(q) >= 0);

  const tabs = [{ k: 'all', l: '全部', n: all.length }]

/* 导航右侧挂件：数字 / 琥珀点 / 待接入小字，默认隐藏，hover·focus 才现 */
function navMeta() {
  const put = (id, val) => {
    const n = document.querySelector(`[data-meta="${id}"]`);
    if (!n) return;
    if (val === true) { n.innerHTML = '<i class="dot"></i>'; n.title = '有待办'; }
    else if (val) { n.textContent = val; }
  };
  const live = store.list('shops').filter(s => s.tag !== '历史').length;
  const assets = store.list('assets').length;
  const todo = store.list('tasks').filter(t => t.status !== '已完成').length;
  put('stores', live);
  put('assets', assets);
  put('tasks', todo);
  put('api', '待接入');
}

function renderNav() {
  const el2 = $('#nav');
  if (!el2) return;
  const groups = [];
  PAGES.forEach(p => {
    const g = groups.find(x => x.t === p.grp);
    (g || groups[groups.push({ t: p.grp, items: [] }) - 1]).items.push(p);
  });
  el2.innerHTML = groups.map(g =>
    `<div class="nav-grp-t">${esc(g.t)}</div>` +
    g.items.map(p => `<button type="button" data-go="${p.id}">
        <span class="ic">${NAV_ICON[p.id] || ''}</span>
        <span class="lb">${esc(typeof TX === 'function' ? TX('nav.' + p.id + '.name') : p.name)}</span>
        <span class="meta" data-meta="${p.id}"></span>
      </button>`).join('')
  ).join('');
  navMeta();
}

/* 单个绝对定位块承载选中态：读选中项 rect → 写 transform / width / height */
function moveGlide() {
  const g = $('#navGlide'), inner = $('#railInner');
  if (!g || !inner) return;
  const cur = $('#nav button.on');
  if (!cur) { g.style.opacity = '0'; return; }
  const ib = inner.getBoundingClientRect();
  const cb = cur.getBoundingClientRect();
  g.style.width = cb.width + 'px';
  g.style.height = cb.height + 'px';
  g.style.transform = `translate3d(${cb.left - ib.left}px, ${cb.top - ib.top}px, 0)`;
}

function setDrawer(open) {
  const rail = document.getElementById('rail');
  const mask = document.getElementById('railMask');
  const burger = document.getElementById('railBurger');
  if (!rail) return;
  rail.dataset.open = open ? 'true' : 'false';
  if (mask) mask.dataset.on = open ? 'true' : 'false';
  if (burger) burger.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function go(id) {
  if (!RENDER[id]) id = 'signal';
  window.__page = id;
  $$('#nav button').forEach(b => {
    const on = b.dataset.go === id;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const p = PAGES.find(x => x.id === id);
  $('#crumb').innerHTML = `工作台 <i>/</i> <b>${esc(typeof TX === 'function' ? TX('nav.' + id + '.name') : p.name)}</b>`;
  $('#viewport').scrollTop = 0;
  render();
  moveGlide();
  setDrawer(false);
}

function render() {
  if (window.__rendering) return;
  window.__rendering = true;
  try {
    const ae = document.activeElement;
    if (ae && ae !== document.body && typeof ae.blur === 'function') ae.blur();
    const id = window.__page || 'signal';
    const seedBar = (store.db.meta && store.db.meta.seed)
      ? `<div class="seed-bar"><span><b>团队共享数据</b>　${store.list('shops').length} 家店铺 · ${store.list('accounts').length} 条账号 · ${store.list('metrics').length} 条指标记录。${store.cloudErr ? '云端暂未接通，改动先存在本机，恢复后自动补传。' : '业务数据和目标值都存在团队云端，谁改所有人都生效，约 1 分钟内自动同步（切回本页会立刻同步）。'}</span></div>` : '';
    $('#viewport').innerHTML = `<div class="view on">${seedBar}${RENDER[id]()}</div>`;
    if (id === 'board') { renderDrill(); bindChart(); }
    if (id === 'stores') bindStores();
    if (id === 'assets') bindAssets();
    updateFoot();
  } finally {
    window.__rendering = false;
  }
}

function updateFoot() {
  /* 侧栏底部改为用户卡后，这里只负责刷新导航挂件的数字 */
  navMeta();
}

/* ---------- 图表交互 ---------- */
function bindChart() {
  const wrap = $('#chartWrap'); if (!wrap) return;
  const svg = wrap.querySelector('svg.chart'); if (!svg) return;
  const tip = $('#tip'), cross = svg.querySelector('#cross');
  if (!tip || !cross) return;
  const iw = C.w - C.pl - C.pr;
  const show = (i, px, py) => {
    const d = chartData[i]; if (!d) return;
    const cx = C.pl + (chartData.length === 1 ? iw / 2 : (iw / (chartData.length - 1)) * i);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '1');
    tip.innerHTML = `<div class="hd">${esc(d.date)}</div>
      <div class="row"><em>采纳率</em><span style="color:var(--amber)">${f1(d.adopt)}%</span></div>
      <div class="row"><em>生成率</em><span style="color:var(--info)">${f1(d.gen)}%</span></div>
      <div class="row"><em>样本店</em><span>${d._n || 0}</span></div>`;
    const rect = svg.getBoundingClientRect();
    const left = (cx / C.w) * rect.width - wrap.scrollLeft;
    tip.style.left = Math.min(Math.max(left, 80), rect.width - 80) + 'px';
    const flip = py != null && py < 74;
    tip.style.top = (flip ? py + 14 : (py != null ? py - 12 : rect.height * 0.5)) + 'px';
    tip.style.transform = flip ? 'translate(-50%,0)' : 'translate(-50%,-100%)';
    tip.classList.add('on');
  };
  $$('.hv', svg).forEach(r => {
    const at = e => {
      const rect = svg.getBoundingClientRect();
      show(+r.dataset.i, e.clientX - rect.left, e.clientY - rect.top);
    };
    r.addEventListener('mouseenter', at);
    r.addEventListener('mousemove', at);
  });
  svg.addEventListener('mouseleave', () => {
    cross.setAttribute('opacity', '0');
    tip.classList.remove('on');
  });

  const ro = $('#readout');
  if (ro && chartData.length) {
    const first = chartData[0], last = chartData[chartData.length - 1];
    const dif = (last.adopt != null && first.adopt != null) ? (last.adopt - first.adopt) : null;
    ro.innerHTML = `区间内采纳率从 <b>${f1(first.adopt)}%</b> 到 <b>${f1(last.adopt)}%</b>${dif == null ? '' : `，净变化 <b>${dif > 0 ? '+' : ''}${f1(dif)} pt</b>`}；
      同期生成率 <b>${f1(first.gen)}%</b> → <b>${f1(last.gen)}%</b>。
      共 <b>${chartData.length}</b> 个数据日，最新一日 <b>${last._n || 0}</b> 家店有记录。`;
  }
}

  const imp = e.target.closest('[data-import]');

      () => { store.clearAll(); toast('已清空，可从零开始', 'ok'); window.__page = 'signal'; render(); },

      .catch(err => toast('恢复失败：' + ((err && err.message) || err), 'bad'));

    }
    store.saveCode(css, js)
      .then(() => { applyUserCode(); toast('已保存并生效 · 所有人刷新后同样生效', 'ok'); })
      .catch(err => toast('保存失败：' + ((err && err.message) || err), 'bad'));

/* 拉取同事的最新改动：无弹窗、无正在编辑的输入、无待写入时才做，避免冲掉手上的内容 */
async function pullLatest(silent) {
  if (!cloud || store._flushing) return false;
  if (Date.now() - (store._lastWrite || 0) < 2000) return false;
  if (document.querySelector('.modal-bd')) return false;
  const ae = document.activeElement;
  if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return false;
  const snap = JSON.stringify(store.db) + '|' + JSON.stringify(store.cfg);
  const oldCode = JSON.stringify(store.code);
  try { await store.hydrate({ noSeed: true }); } catch (e) { return false; }
  await store.loadTeam();
  /* 云端拿到的是「界面改过的」部分，再把 CSV 数据源合回来（CSV 只覆盖更旧的记录） */
  if (typeof mergeCsvData === 'function') mergeCsvData();
  applyTexts();
  if (JSON.stringify(store.code) !== oldCode) applyUserCode();
  if (snap === JSON.stringify(store.db) + '|' + JSON.stringify(store.cfg)) return false;
  if (!store.cloudErr) hideCloudNotice();
  render();
  setUserCard();
  if (!silent) toast('已同步同事的最新改动', 'ok');
  return true;
}

/* 云端未就绪时的常驻提示条（最常见：云端暂不可达） */
function cloudNotice(msg, retry) {
  let el = document.getElementById('cloudNotice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cloudNotice';
    el.style.cssText = [
      'position:fixed', 'left:50%', 'top:54px', 'transform:translateX(-50%)', 'z-index:120',
      'display:flex', 'align-items:center', 'gap:10px', 'max-width:min(760px,92vw)',
      'padding:9px 12px', 'border-radius:10px', 'font-size:12.5px', 'line-height:1.55',
      'background:var(--warn-soft)', 'color:var(--warn)', 'border:1px solid var(--warn)',
      'box-shadow:0 8px 24px -12px rgba(10,26,32,.45)'
    ].join(';');
    document.body.appendChild(el);
  }
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span>`;
  if (retry) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = '已建好，重试';
    b.style.cssText = 'height:26px;padding:0 10px;font-size:12px;white-space:nowrap';
    b.addEventListener('click', retry);
    el.appendChild(b);
  }
  return el;
}
function hideCloudNotice() {
  const el = document.getElementById('cloudNotice');
  if (el) el.remove();
}
/* 按当前错误状态决定提示内容：建表类问题给「重试」，网络问题只告知 */
function syncNotice() {
  if (!store.cloudErr) { hideCloudNotice(); return; }
  const needSql = /PGRST205|42P01|Could not find the table|schema cache/i.test(store.cloudErr);
  cloudNotice(
    needSql
      ? '云端已连上，但数据表不可用：请联系项目管理员检查云端库（表 wb_records / wb_kv），再点右边重试。在那之前，改动只存在你这台电脑上。'
      : '云端暂时连不上（' + store.cloudErr + '），改动先存在本机，恢复后打开页面会自动补传。',
    needSql ? retryCloud : null
  );
}
async function retryCloud() {
  hideCloudNotice();
  store.cloudErr = '';
  try { await store.hydrate(); } catch (e) { store.cloudErr = (e && e.message) || String(e); }
  setUserCard();
  render();
  if (store.cloudErr) syncNotice();
  else toast('云端已接通，团队数据已同步', 'ok');
}

/* 同步数据 → 起界面。云端挂了也照常进，先跑本机缓存 */
async function enterApp() {
  store.session = auth.session;
  showLoading('正在同步团队数据…');
  let r = null;
  try { r = await store.hydrate(); }
  catch (e) { r = null; store.cloudErr = (e && e.message) || String(e); }
  await store.loadTeam();
  /* 数据源：先把 CSV 合进来再画第一帧，避免先闪一下旧数据 */
  try { await loadDataCsv(true); mergeCsvData(); } catch (e) {}
  hideLoading();
  setUserCard();
  startApp();
  applyTexts();
  applyUserCode();
  applyMode();
  syncNotice();
  if (r && r.seeded) toast('已初始化团队数据 · ' + r.rows + ' 条记录', 'ok');
}

function startApp() {
  if (window.__started) return;
  window.__started = true;
  renderNav();
  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go);
  });

  /* 移动端抽屉（≤920px），顶栏汉堡唤起 */
  const railEl = $('#rail');
  if (railEl) {
    railEl.classList.add('no-anim');
    const burger = $('#railBurger'), mask = $('#railMask');
    if (burger) burger.addEventListener('click', () => setDrawer(true));
    if (mask) mask.addEventListener('click', () => setDrawer(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });
  }

  const out = $('#uOut');
  if (out) out.addEventListener('click', () => askName());

  go('signal');

  /* 团队协作：每 60 秒与云端对一次，切回标签页时立刻对一次 */
  setInterval(() => { if (!document.hidden) pullLatest(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullLatest(true); });

  /* 首帧先无动画落位，下一帧再淡入并恢复过渡，避免滑块从左上方飞入 */
  requestAnimationFrame(() => {
    moveGlide();
    requestAnimationFrame(() => {
      if (railEl) { railEl.classList.remove('no-anim'); railEl.classList.add('is-ready'); }
    });
  });
  window.addEventListener('resize', () => moveGlide());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveGlide());
}

/* ---- 自定义样式 / 脚本 ---- */
function checkJs(code) {
  try { new Function(code); return null; }
  catch (e) { return e.message; }
}

function applyUserCode() {
  const old = document.getElementById('userCss');
  if (old) old.remove();
  const c = store.code || {};
  if (c.css) {
    const s = document.createElement('style');
    s.id = 'userCss';
    s.textContent = c.css;
    document.head.appendChild(s);
  }
  if (c.js) {
    const bad = checkJs(c.js);
    if (bad) { toast('自定义脚本有语法错误，已跳过：' + bad, 'bad'); return; }
    try { new Function(c.js)(); }
    catch (e) { toast('自定义脚本运行出错：' + ((e && e.message) || e), 'bad'); }
  }
}

    <textarea id="setJs" class="set-code" spellcheck="false" placeholder="// 页面加载完执行一次，可用 window.__OPS__ 访问数据，例如：&#10;// __OPS__.toast('今天共 ' + __OPS__.store.list('shops').length + ' 家店')">${esc(c.js || '')}</textarea>
    <div class="set-tip">保存前会做语法检查；运行出错不会白屏，只会提示并跳过。能访问 <code>__OPS__.store / render / go / toast</code>。</div>
    <div class="set-acts">
      <button class="btn primary" data-codesave="js">保存脚本并生效</button>
      <button class="btn" data-codeclear>清空全部自定义代码</button>
    </div>
  </div>

  <div class="block-title" style="margin-top:26px">数据源（团队 CSV）</div>
  <div class="set-panel">
    <div id="dataStatus"></div>
    <div class="set-tip">CSV 放在仓库 <code>data/</code> 目录。成员改完提交，1–2 分钟发布后，所有人的页面会在 60 秒内自动刷新。<br>
      合并规则：同一行「谁更晚谁生效」——界面改动时间晚于 CSV 发布时间就保留界面版本，否则用 CSV 覆盖；界面上新建的行不会被 CSV 删除。</div>
    <div class="set-acts">
      <button class="btn" data-datarefresh>立即检查数据源</button>
    </div>
  </div>

  <div class="block-title" style="margin-top:26px">访问与权限</div>
  <div class="set-panel">
    <table class="set-tbl"><tbody>
      <tr><td class="set-lb">当前模式</td><td><b id="modeNow">—</b></td><td class="set-def">右上角徽标可切换</td></tr>
      <tr><td class="set-lb">外部访问</td><td>只读预览</td><td class="set-def">链接发给谁，谁都能看，但改不了</td></tr>
      <tr><td class="set-lb">项目成员</td><td>输入团队编辑码后可编辑</td><td class="set-def">数据 / 页面 / 文案 / 代码</td></tr>
    </tbody></table>
  </div>

  <div class="set-tip" style="margin-top:22px">
    自定义代码存在云端，全组共用一份；谁改的会记在 <b>${esc((c.by || '—'))}</b>${c.at ? ' · ' + esc(agoText(c.at)) : ''}。
  </div>`;
  setTimeout(() => {
    renderDataStatus();
    const m = document.getElementById('modeNow');
    if (m) m.textContent = canEdit() ? '成员编辑' : '只读预览';
  }, 0);
  return html;
}

/* =========================================================
   数据源同步：data/*.csv → 页面
   - CSV 是团队共享的数据源，随仓库一起发布
   - 启动时读一次，之后每 60 秒查一次 manifest.json（只有几百字节）
   - manifest 里的版本变了 = 有人改了 CSV → 自动重新拉取并刷新页面
   - 合并规则「谁更晚谁生效」：界面改动带 __mt 时间戳，
     比 CSV 发布时间新就保留界面版本，否则用 CSV 覆盖
   ========================================================= */

const DATA_KINDS = ['shops', 'accounts', 'metrics', 'alerts', 'tasks', 'qc', 'assets', 'apis'];
const DATA_NUM_FIELDS = {
  shops: ['order'],
  metrics: ['adopt', 'gen', 'conv', 'risk', 'agent', 'resp'],
  qc: ['hits'],
  apis: ['calls', 'errors']
};
const LS_DATA_VER = 'wb.signal.v3.dataver';

let dataCache = null;   // { version, publishedAt, counts, byKind }
let dataCheckedAt = 0;  // 上次检查时间
let dataErr = '';

function dataBase() {
  const c = window.__OPS_CFG__ || {};
  return String(c.dataBase || 'data/').replace(/\/+$/, '') + '/';
}
function dataPollMs() {
  const c = window.__OPS_CFG__ || {};
  const s = +c.pollSeconds || 60;
  return Math.max(15, s) * 1000;
}

/* RFC4180 够用的 CSV 解析：支持引号包裹、字段内逗号、双引号转义、CRLF */
function csvParse(text) {
  let t = String(text || '');
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  const rows = [];
  let field = '', row = [], q = false, i = 0;
  while (i < t.length) {
    const c = t[i];
    if (q) {
      if (c === '"') {
        if (t[i + 1] === '"') { field += '"'; i += 2; continue; }
        q = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"') { q = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => h.trim());
  return rows
    .filter(r => r.some(x => String(x).trim() !== ''))
    .map(r => {
      const o = {};
      head.forEach((h, ix) => { o[h] = r[ix] == null ? '' : r[ix]; });
      return o;
    });
}

/* CSV 里全是字符串，按字段类型还原成数字，避免聚合时变成字符串拼接 */
function typed(kind, obj) {
  const nums = DATA_NUM_FIELDS[kind] || [];
  nums.forEach(f => {
    if (obj[f] === '' || obj[f] == null) { obj[f] = null; return; }
    const n = parseFloat(obj[f]);
    obj[f] = isNaN(n) ? null : n;
  });
  return obj;
}

async function fetchText(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}

/* 读 manifest，版本变了就把所有 CSV 拉下来。
   返回 true 表示数据有更新。 */
async function loadDataCsv(force) {
  const base = dataBase();
  try {
    const mf = JSON.parse(await fetchText(base + 'manifest.json?t=' + Date.now()));
    if (!mf || !mf.version) throw new Error('manifest 格式不对');
    if (!force && dataCache && dataCache.version === mf.version) {
      dataCheckedAt = Date.now();
      dataErr = '';
      return false;
    }
    const byKind = {};
    const files = Array.isArray(mf.files) ? mf.files : [];
    for (let i = 0; i < DATA_KINDS.length; i++) {
      const kind = DATA_KINDS[i];
      if (files.length && files.indexOf(kind + '.csv') < 0) continue;
      try {
        const txt = await fetchText(base + kind + '.csv?t=' + Date.now());
        byKind[kind] = csvParse(txt).map(r => typed(kind, r));
      } catch (e) { /* 单个文件坏了不影响其它集合 */ }
    }
    const changed = !dataCache || dataCache.version !== mf.version;
    dataCache = {
      version: mf.version,
      publishedAt: Date.parse(mf.publishedAt) || 0,
      counts: mf.counts || {},
      byKind: byKind
    };
    dataCheckedAt = Date.now();
    dataErr = '';
    try { localStorage.setItem(LS_DATA_VER, mf.version); } catch (e) {}
    return changed;
  } catch (e) {
    dataErr = (e && e.message) || String(e);
    dataCheckedAt = Date.now();
    return false;
  }
}

/* 把 CSV 合并进内存库。规则：
   1) 同一 id：界面改动时间 __mt 晚于 CSV 发布时间 → 保留界面版本，否则 CSV 覆盖
   2) CSV 里没有的 id：只有「上次确实来自 CSV」的行才会被删除；
      界面上新建/历史遗留的行一律保留，绝不因为一次同步丢数据
   返回被改动的行数 */
function mergeCsvData() {
  if (!dataCache || !dataCache.byKind) return 0;
  const mfAt = dataCache.publishedAt;
  let touched = 0;

  DATA_KINDS.forEach(kind => {
    const rows = dataCache.byKind[kind];
    if (!rows || !rows.length) return;
    if (!Array.isArray(store.db[kind])) store.db[kind] = [];

    const list = store.db[kind];
    const byId = {};
    list.forEach(r => { if (r && r.id) byId[r.id] = r; });

    rows.forEach(src => {
      if (!src || !src.id) return;
      const cur = byId[src.id];
      if (cur && +cur.__mt && +cur.__mt > mfAt) return;  // 界面上的更新更晚，别覆盖
      if (cur) {
        const before = JSON.stringify(cur);
        Object.keys(src).forEach(k => { cur[k] = src[k]; });
        cur.__src = 'csv';
        if (JSON.stringify(cur) !== before) touched++;
      } else {
        const rec = Object.assign({ id: src.id }, src, { __src: 'csv' });
        list.push(rec);
        byId[rec.id] = rec;
        touched++;
      }
    });

    const csvIds = {};
    rows.forEach(r => { if (r && r.id) csvIds[r.id] = 1; });
    const kept = list.filter(r => {
      if (!r || !r.id) return false;
      if (csvIds[r.id]) return true;
      if (r.__src !== 'csv') return true;             // 界面新增或历史数据，保留
      if (+r.__mt && +r.__mt > mfAt) return true;     // 界面上刚改过，保留
      return false;                                   // CSV 里删掉了 → 一起删
    });
    if (kept.length !== list.length) {
      touched += list.length - kept.length;
      store.db[kind] = kept;
    }
  });
  return touched;
}

/* 检查一次：有更新就合并 + 重渲染。
   silent=true 用于轮询，不给弹窗、不在用户打字时打断。 */
async function refreshDataCsv(silent) {
  const changed = await loadDataCsv(false);
  if (!changed) { renderDataStatus(); return false; }
  const ae = document.activeElement;
  const typing = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName);
  if (typing && silent) return false;                 // 等用户打完字下一轮再说
  const n = mergeCsvData();
  render();
  renderDataStatus();
  if (!silent && n) toast('数据源已更新 · ' + n + ' 行 · 版本 ' + dataCache.version, 'ok');
  return true;
}

function dataStatusText() {
  if (!dataCache) {
    if (dataErr) return '数据源未连上（' + dataErr + '）';
    return '数据源未加载';
  }
  return '数据源 ' + dataCache.version + ' · ' + agoText(Date.parse(dataCache.publishedAt) || 0) + '发布';
}

/* 设置页里的数据源面板（只读信息 + 手动刷新） */
function renderDataStatus() {
  const el = document.getElementById('dataStatus');
  if (el) {
    const mf = dataCache;
    const rows = mf ? DATA_KINDS.map(k => `<tr><td>data/${k}.csv</td><td class="mono">${(mf.byKind[k] || []).length} 行</td></tr>`).join('') : '';
    el.innerHTML = !mf
      ? `<div class="set-tip">还没读到数据源${dataErr ? '：' + esc(dataErr) : ''}。确认 <code>data/</code> 已随站点发布。</div>`
      : `<table class="set-tbl"><tbody>
          <tr><td class="set-lb">当前版本</td><td class="mono">${esc(mf.version)}</td><td class="set-def">${esc(mf.publishedAt ? new Date(mf.publishedAt).toLocaleString('zh-CN') : '—')}</td></tr>
          <tr><td class="set-lb">检查时间</td><td class="mono">${esc(dataCheckedAt ? new Date(dataCheckedAt).toLocaleTimeString('zh-CN') : '—')}</td><td class="set-def">每 ${Math.round(dataPollMs() / 1000)} 秒自动检查一次</td></tr>
          ${rows}
        </tbody></table>`;
  }
  const pill = document.getElementById('dataPill');
  if (pill) {
    pill.textContent = dataCache ? '数据源 ' + dataCache.version : '数据源未连';
    pill.title = dataStatusText();
  }
}
function startDataSync() {
  renderDataStatus();
  setInterval(() => { if (!document.hidden) refreshDataCsv(true); }, dataPollMs());
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refreshDataCsv(true);
  });
}

/* =========================================================
   访问模式：只读预览 / 成员编辑
   - 任何人拿到链接，默认【只读预览】：能看所有页面与数据，不能改
   - 项目成员输入团队编辑码后进入编辑模式，改动写进团队云端
   - 编辑状态只记在本机浏览器，换人换设备要重新输码
   - 说明：这是前端软闸（挡的是链接外传后随手乱改的人）。
     要做「后端强制隔离」，需要开 Supabase Auth 并按用户写 RLS，
     步骤见 MIGRATION.md 第 4 节「硬隔离（可选）」。
   ========================================================= */

const LS_EDIT = 'wb.signal.v3.edit';
const MODE = { unlocked: false, verified: false };

function editSha() {
  const c = window.__OPS_CFG__ || {};
  return String(c.editSha || '').toLowerCase();
}
function editHint() {
  const c = window.__OPS_CFG__ || {};
  return String(c.editHint || '团队编辑码向项目管理员索取');
}
function canEdit() { return !!MODE.unlocked; }

function readEditFlag() {
  try { return localStorage.getItem(LS_EDIT) === '1'; } catch (e) { return false; }
}
function writeEditFlag(on) {
  try {
    if (on) localStorage.setItem(LS_EDIT, '1'); else localStorage.removeItem(LS_EDIT);
  } catch (e) {}
}

async function sha256Hex(s) {
  if (!(window.crypto && window.crypto.subtle)) {
    throw new Error('当前页面不是 https / localhost，浏览器不允许校验编辑码');
  }
  const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function normCode(s) { return String(s == null ? '' : s).trim().toLowerCase(); }

/* 把「只读」这件事落到界面上：隐藏写入口、改光标、禁用设置页输入 */
function applyMode() {
  const ro = !canEdit();
  document.body.classList.toggle('ro', ro);
  const pill = document.getElementById('modePill');
  if (pill) {
    pill.textContent = ro ? '只读预览' : '成员编辑';
    pill.classList.toggle('on', !ro);
    pill.title = ro
      ? '当前是只读预览：可以看全部数据，不能修改。项目成员点这里输入编辑码。'
      : '当前是成员编辑模式：你的改动会写入团队云端。点这里退回只读。';
  }
  const tip = document.getElementById('roTip');
  if (tip) tip.style.display = ro ? '' : 'none';
}

function setEditMode(on, quiet) {
  MODE.unlocked = !!on;
  writeEditFlag(!!on);
  applyMode();
  if (!quiet) toast(on ? '已进入成员编辑模式' : '已切回只读预览', on ? 'ok' : '');
  render();
}

/* 输码解锁 */
function askEditCode() {
  const hint = editHint();
  openModal({
    title: '进入成员编辑模式',
    body: `<div style="font-size:12.5px;line-height:1.85;color:var(--ink2);margin-bottom:10px">
        这是团队内部工作台，外部链接默认<b>只读预览</b>。<br>输入团队编辑码后，你就能改数据、改页面、改设置，改动会写进团队云端，所有人都看得到。
      </div>
      <input id="ecInp" type="password" autocomplete="off" placeholder="团队编辑码"
        style="width:100%;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;outline:none;font-family:var(--mono)" />
      <div style="font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.7">${esc(hint)}</div>`,
    buttons: [
      { label: '只读就行', cls: 'ghost' },
      { label: '解锁', cls: 'primary', fn: c => {
        const v = ($('#ecInp') || {}).value;
        tryUnlock(v).then(ok => {
          if (ok) { c(); setEditMode(true); }
        });
      } }
    ]
  });
  setTimeout(() => { const i = $('#ecInp'); if (i) i.focus(); }, 160);
}

async function tryUnlock(code) {
  const v = normCode(code);
  if (!v) { toast('请先输入编辑码', 'bad'); return false; }
  let h = '';
  try { h = await sha256Hex(v); }
  catch (e) { toast(e.message, 'bad'); return false; }
  if (h !== editSha()) {
    toast('编辑码不对，或你只有查看权限', 'bad');
    return false;
  }
  return true;
}

/* 首次进来：恢复本机记住的编辑状态（只认本机开关，不认链接参数）
   支持 ?edit=1 只是给管理员收藏用的快捷入口，仍需输码 */
function initMode() {
  MODE.unlocked = readEditFlag();
  applyMode();
  if (window.__modeInit) return;
  window.__modeInit = 1;
  const pill = document.getElementById('modePill');
  if (pill) {
    pill.addEventListener('click', () => {
      if (canEdit()) {
        confirmDialog('退回只读预览', '退出编辑模式后，这个人在这台设备上就只能看、不能改。随时可以再输码进来。', () => setEditMode(false), '退回只读');
      } else {
        askEditCode();
      }
    });
  }
}

/* ---------- init ---------- */
store.initCfg();
initMode();
(async function boot() {
  await auth.restore();
  await enterApp();
  initMode();
  startDataSync();
})();

/* 对外的运行时接口：设置页里的「自定义脚本」通过 window.__OPS__ 访问这些 */
window.__OPS__ = {
  store: store, render: render, go: go, toast: toast, cloud: cloud,
  KINDS: KINDS, PAGES: PAGES,
  TX: TX, applyTexts: applyTexts, applyUserCode: applyUserCode,
  canEdit: canEdit, setEditMode: setEditMode, dataCache: () => dataCache,
  refreshDataCsv: refreshDataCsv, dataStatusText: dataStatusText,
  $: $, $$: $$, esc: esc, uid: uid, num: num, openForm: openForm, openModal: openModal
};
})();

</script>
<div id="modal-root"></div>
<div id="toast-root"></div>
