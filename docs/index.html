<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI运营组工作台 v5.0</title>
<link rel="icon" href="data:,">
<style>
/* ============ tokens ============ */
:root{
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  --rail:248px;
  --r:2px;
}
html[data-theme="dark"]{
  --bg:#0A0E14;
  --panel:#10151F;
  --panel2:#151C29;
  --panel3:#1A2231;
  --line:#1D2532;
  --line2:#2A3444;
  --ink:#E7ECF3;
  --ink2:#98A5B8;
  --ink3:#5A6779;
  --amber:#F0A030;
  --amber-soft:rgba(240,160,48,.13);
  --good:#31C48D;
  --good-soft:rgba(49,196,141,.12);
  --warn:#E5B23C;
  --warn-soft:rgba(229,178,60,.12);
  --bad:#E85C46;
  --bad-soft:rgba(232,92,70,.12);
  --info:#5B9BD5;
  --info-soft:rgba(91,155,213,.12);
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 12px 28px -18px rgba(0,0,0,.9);
  --grid:#232C3B;
}
html[data-theme="light"]{
  --bg:#F4F5F2;
  --panel:#FFFFFF;
  --panel2:#FAFAF7;
  --panel3:#F0F1EC;
  --line:#DBDCD3;
  --line2:#C3C5B9;
  --ink:#1A1C1B;
  --ink2:#5C635E;
  --ink3:#8E948E;
  --amber:#B96D0C;
  --amber-soft:rgba(185,109,12,.10);
  --good:#127A57;
  --good-soft:rgba(18,122,87,.10);
  --warn:#96700F;
  --warn-soft:rgba(150,112,15,.10);
  --bad:#B23A26;
  --bad-soft:rgba(178,58,38,.10);
  --info:#2C6291;
  --info-soft:rgba(44,98,145,.10);
  --shadow:0 1px 2px rgba(26,28,27,.05), 0 10px 24px -20px rgba(26,28,27,.4);
  --grid:#E8E9E3;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  font-size:13px;
  line-height:1.55;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-wrap:pretty;
  overflow:hidden;
}
::selection{background:var(--amber-soft);color:var(--ink)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit;font-size:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ============ shell ============ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}


.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{
  height:52px;flex:0 0 52px;
  border-bottom:1px solid var(--line);
  background:var(--panel);
  display:flex;align-items:center;gap:16px;
  padding:0 24px;
}
.crumb{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:8px}
.crumb b{color:var(--ink);font-weight:500;font-size:13px}
.crumb i{color:var(--line2);font-style:normal}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.stamp{
  font-family:var(--mono);font-size:11px;color:var(--ink3);
  border:1px solid var(--line);padding:3px 8px;border-radius:var(--r);
}
.stamp b{color:var(--ink2);font-weight:400}
.icon-btn{
  width:28px;height:28px;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:var(--r);color:var(--ink2);
  transition:.12s linear;
}
.icon-btn:hover{border-color:var(--line2);color:var(--ink);background:var(--panel2)}

.viewport{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 24px 72px;scroll-behavior:smooth}
.viewport::-webkit-scrollbar{width:10px}
.viewport::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid var(--bg)}

.view{display:none;animation:fade .22s ease-out}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ primitives ============ */
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.sec-head h2{font-size:16px;font-weight:600;letter-spacing:.01em}
.sec-head .sub{font-size:12px;color:var(--ink3)}
.sec-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.divider{height:1px;background:var(--line);margin:26px 0}
.block-title{
  display:flex;align-items:center;gap:10px;
  font-size:11px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink3);margin:0 0 10px;
}
.block-title::after{content:"";flex:1;height:1px;background:var(--line)}

.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);
}
.pad{padding:16px 18px}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
  padding:1.5px 6px;border-radius:var(--r);white-space:nowrap;
  border:1px solid transparent;
}
.chip.p0{color:var(--bad);background:var(--bad-soft);border-color:rgba(232,92,70,.24)}
.chip.p1{color:var(--warn);background:var(--warn-soft);border-color:rgba(229,178,60,.24)}
.chip.p2{color:var(--info);background:var(--info-soft);border-color:rgba(91,155,213,.24)}
.chip.ok{color:var(--good);background:var(--good-soft);border-color:rgba(49,196,141,.24)}
.chip.mute{color:var(--ink3);background:var(--panel3);border-color:var(--line)}
.chip.amber{color:var(--amber);background:var(--amber-soft);border-color:rgba(240,160,48,.26)}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;padding:5px 11px;border-radius:var(--r);
  border:1px solid var(--line2);color:var(--ink2);background:var(--panel2);
  transition:.12s linear;white-space:nowrap;
}
.btn:hover{color:var(--ink);border-color:var(--ink3);background:var(--panel3)}
.btn.primary{
  background:var(--amber);border-color:var(--amber);color:#0A0E14;font-weight:500;
}
.btn.primary:hover{filter:brightness(1.08)}
html[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{font-size:11px;padding:3px 8px}

/* KPI strip */
.kpis{
  display:grid;grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);overflow:hidden;
}
.kpi{
  padding:13px 14px 12px;border-right:1px solid var(--line);
  position:relative;transition:background .14s linear;
}
.kpi:last-child{border-right:none}
.kpi:hover{background:var(--panel2)}
.kpi .v{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:24px;line-height:1.1;letter-spacing:-.02em;
}
.kpi .l{font-size:11px;color:var(--ink3);margin-top:4px;white-space:nowrap}
.kpi.alert .v{color:var(--bad)}
.kpi.alert{background:rgba(232,92,70,.05);box-shadow:inset 0 2px 0 rgba(232,92,70,.55)}
.kpi.warn .v{color:var(--warn)}
.kpi.good .v{color:var(--good)}

/* alert rows */
.alist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.arow{
  display:grid;grid-template-columns:74px 108px 1fr 92px 92px;
  align-items:center;gap:14px;
  padding:11px 16px;border-bottom:1px solid var(--line);
  transition:background .12s linear;
}
.arow:last-child{border-bottom:none}
.arow:hover{background:var(--panel2)}
.arow .t{font-size:13px;font-weight:500}
.arow .d{font-size:11.5px;color:var(--ink3);margin-top:2px}
.arow .due{font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right}
.arow .due.late{color:var(--bad)}
.arow .act{text-align:right}
.arow.collapsible{cursor:pointer}

/* insight */
.insight{
  border:1px solid var(--line);border-top:2px solid var(--amber);
  border-radius:var(--r);background:var(--panel);
  padding:16px 18px;
}
.insight h3{
  font-size:14px;font-weight:600;line-height:1.5;
  display:flex;gap:9px;align-items:flex-start;
}
.insight h3 em{font-style:normal;color:var(--amber);font-family:var(--mono);font-size:11px;padding-top:2px}
.insight .ev{
  margin-top:9px;font-size:12px;color:var(--ink2);line-height:1.75;
  padding-left:20px;
}
.insight .ev b{color:var(--ink);font-family:var(--mono);font-weight:500}
.insight-acts{display:flex;gap:8px;margin-top:13px;padding-left:20px;flex-wrap:wrap}

.dialogues{margin-top:12px;padding-left:20px;display:none;flex-direction:column;gap:8px}
.dialogues.open{display:flex;animation:fade .18s ease-out}
.dlg{
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel2);padding:10px 12px;
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
}
.dlg .q{font-size:12px;color:var(--ink)}
.dlg .r{font-size:11.5px;color:var(--ink3);margin-top:3px}
.dlg .r i{font-style:normal;color:var(--ink2)}
.dlg .sc{font-family:var(--mono);font-size:11px;text-align:right;white-space:nowrap}
.dlg .sc b{display:block;font-size:12px}
.dlg .sc.bad b{color:var(--bad)}
.dlg .sc.good b{color:var(--good)}

/* chart */
.chart-wrap{position:relative;overflow-x:auto;overflow-y:hidden}
.chart-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:6px;flex-wrap:wrap}
.legend{display:flex;gap:14px;align-items:center;margin-left:auto}
.legend span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);font-family:var(--mono)}
.legend i{width:14px;height:2px;border-radius:2px;display:block}
.legend i.dash{background:none;border-top:1px dashed var(--ink3);height:0}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.axis text{font-family:var(--mono);font-size:10px;fill:var(--ink3)}
.gl{stroke:var(--grid);stroke-width:1}
.gl.zero{stroke:var(--line2)}
.target{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.line-a{fill:none;stroke:var(--amber);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line-b{fill:none;stroke:var(--info);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--panel);stroke-width:2}
.endlabel{font-family:var(--mono);font-size:10.5px;font-weight:500}
.tip{
  position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);
  padding:7px 9px;font-size:11px;line-height:1.6;white-space:nowrap;color:var(--ink);
  box-shadow:0 10px 24px -8px rgba(0,0,0,.7);transition:opacity .1s linear;z-index:6;
}
.tip.on{opacity:1}
.tip .row{display:flex;gap:12px;justify-content:space-between;font-family:var(--mono)}
.tip .row em{font-style:normal;color:var(--ink2)}
.tip .hd{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-bottom:3px}

.readout{
  margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink2);line-height:1.8;
}
.readout b{color:var(--ink);font-family:var(--mono);font-weight:500}
.readout .em{color:var(--amber)}

/* tables */
table{width:100%;border-collapse:collapse}
th{
  font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink3);font-weight:400;text-align:left;
  padding:8px 12px;border-bottom:1px solid var(--line2);
  background:var(--panel2);white-space:nowrap;
}
td{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s linear}
tbody tr:hover{background:var(--panel2)}
td.n,th.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
td.dim{color:var(--ink3)}
td.strong{font-weight:500}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.delta{font-family:var(--mono);font-size:11.5px}
.delta.up{color:var(--good)}
.delta.down{color:var(--bad)}
.delta.flat{color:var(--ink3)}

/* store cards */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{
  padding:5px 11px;font-size:12px;color:var(--ink2);
  border-right:1px solid var(--line);transition:.12s linear;
}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--panel3);color:var(--ink)}
.seg button:hover{color:var(--ink)}
.seg button b{font-family:var(--mono);font-weight:400;color:var(--ink3);margin-left:4px;font-size:10.5px}
.seg button.on b{color:var(--amber)}
.search{
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:0 9px;height:28px;min-width:200px;flex:1;max-width:280px;
  transition:border-color .12s linear;
}
.search:focus-within{border-color:var(--amber)}
.search input{border:none;background:none;outline:none;color:var(--ink);width:100%;font-size:12px}
.search input::placeholder{color:var(--ink3)}
.search svg{flex:0 0 auto;color:var(--ink3)}
select{
  height:28px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);color:var(--ink2);font-size:12px;padding:0 7px;
  font-family:inherit;outline:none;cursor:pointer;
}
select:focus{border-color:var(--amber)}

.grid-stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.scard{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:13px 14px;transition:.14s linear;cursor:default;position:relative;overflow:hidden;
}
.scard:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.scard .nm{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.scard .meta{font-size:11px;color:var(--ink3);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scard .m{
  margin-top:12px;display:flex;align-items:baseline;gap:6px;
}
.scard .m .big{font-family:var(--mono);font-size:22px;letter-spacing:-.02em;line-height:1}
.scard .m .u{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.scard .m .st{margin-left:auto;font-size:11px}
.scard .bar{
  height:2px;background:var(--panel3);margin-top:10px;border-radius:2px;overflow:hidden;
}
.scard .bar i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .5s ease-out}
.scard.hot .bar i{background:var(--bad)}
.scard.warn .bar i{background:var(--warn)}
.st-bad{color:var(--bad)}
.st-warn{color:var(--warn)}
.st-ok{color:var(--ink3)}
.empty{
  grid-column:1/-1;border:1px dashed var(--line2);border-radius:var(--r);
  padding:34px;text-align:center;color:var(--ink3);font-size:12px;
}

/* owners */
.owners{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.owner{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:13px 14px}
.owner .av{
  width:26px;height:26px;border-radius:2px;display:grid;place-items:center;
  background:var(--panel3);color:var(--ink2);font-size:12px;font-weight:500;
  border:1px solid var(--line2);
}
.owner .hd{display:flex;align-items:center;gap:9px}
.owner .hd .nm{font-size:13px;font-weight:500}
.owner .hd .rl{font-size:11px;color:var(--ink3)}
.owner .row2{margin-top:11px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.owner .row2 div{min-width:0}
.owner .row2 div span{display:block;font-family:var(--mono);font-size:15px;line-height:1.2;white-space:nowrap}
.owner .row2 div em{font-style:normal;font-size:10px;color:var(--ink3);white-space:nowrap}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.col-hd{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.col-hd .nm{font-size:12px;color:var(--ink2);letter-spacing:.02em}
.col-hd .ct{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.col-hd .dot{width:5px;height:5px;border-radius:50%;background:var(--ink3)}
.col.doing .dot{background:var(--amber)}
.col.done .dot{background:var(--good)}
.tcard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 11px;margin-bottom:7px;transition:.12s linear;
}
.tcard:last-child{margin-bottom:0}
.tcard:hover{border-color:var(--line2);transform:translateX(1px)}
.tcard .tt{font-size:12.5px;line-height:1.45}
.tcard .tf{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px;color:var(--ink3)}
.tcard .tf .who{color:var(--ink2)}
.tcard .tf .when{margin-left:auto;font-family:var(--mono);font-size:10.5px}
.tcard .tf .when.late{color:var(--bad)}
.tcard.done .tt{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}

/* misc blocks */
.split{display:grid;gap:14px}
.split.c2{grid-template-columns:1.35fr 1fr}
.split.c2b{grid-template-columns:1fr 1.3fr}
.mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.mini-kpis.four{grid-template-columns:repeat(4,1fr)}
.mini-kpis > div{padding:14px 15px;border-right:1px solid var(--line)}
.mini-kpis > div:last-child{border-right:none}
.mini-kpis .v{font-family:var(--mono);font-size:22px;line-height:1.1}
.mini-kpis .l{font-size:10.5px;color:var(--ink3);margin-top:4px}
.mini-kpis .v small{font-size:11px;color:var(--ink3);margin-left:2px}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.flow > div{padding:14px 15px;border-right:1px solid var(--line);position:relative}
.flow > div:last-child{border-right:none}
.flow .st{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.1em}
.flow .nm{font-size:13px;font-weight:500;margin-top:5px}
.flow .ds{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.6}
.flow > div::after{
  content:"";position:absolute;right:-4px;top:50%;width:7px;height:7px;
  border-top:1px solid var(--line2);border-right:1px solid var(--line2);
  transform:translateY(-50%) rotate(45deg);background:var(--panel);z-index:1;
}
.flow > div:last-child::after{display:none}

.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.targets > div{padding:13px 15px;border-right:1px solid var(--line)}
.targets > div:last-child{border-right:none}
.targets .nm{font-size:11px;color:var(--ink3)}
.targets .vals{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.targets .vals b{font-family:var(--mono);font-size:19px;font-weight:500}
.targets .vals s{font-family:var(--mono);font-size:11px;color:var(--ink3);text-decoration:none}
.targets .tagline{margin-top:6px;font-size:10.5px;font-family:var(--mono)}

.note{font-size:11px;color:var(--ink3);margin-top:9px;line-height:1.7}
.foot{
  margin-top:34px;padding-top:14px;border-top:1px solid var(--line);
  display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font-size:11px;color:var(--ink3);font-family:var(--mono);
}
.foot .sep{color:var(--line2)}

/* responsive */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi:nth-child(4){border-right:none}
  .kpi:nth-child(n+5){border-top:1px solid var(--line)}
  .split.c2,.split.c2b{grid-template-columns:1fr}
  .kanban{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(2,1fr)}
  .flow > div:nth-child(2){border-right:none}
  .flow > div:nth-child(n+3){border-top:1px solid var(--line)}
  .flow > div::after{display:none}
  .targets{grid-template-columns:repeat(2,1fr)}
  .targets > div:nth-child(2){border-right:none}
  .targets > div:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .viewport{padding:16px 14px 90px}
  .topbar{padding:0 14px}
  .crumb{display:none}
  .topbar::before{content:"AI运营组工作台";font-size:13px;font-weight:500;color:var(--ink)}
  .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto}
  svg.chart{min-width:600px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi{border-right:none!important;border-bottom:1px solid var(--line)}
  .arow{grid-template-columns:auto 1fr;gap:5px 10px;padding:12px 14px;align-items:center}
  .arow > div:nth-child(3),
  .arow > div:nth-child(4),
  .arow > div:nth-child(5){grid-column:1/-1}
  .arow .due{text-align:left;margin-top:2px}
  .arow .act{text-align:left}
  .stamp{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ============ v2 新增：页面头动作 / 表单 / 弹窗 / 提示 / 数据工具 ============ */
.head-actions{display:flex;gap:8px;align-items:center}
.btn.danger{color:var(--bad);border-color:rgba(232,92,70,.35);background:var(--bad-soft)}
.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn svg{width:12px;height:12px;display:block}

/* 行内操作 */
.acts{display:flex;gap:4px;justify-content:flex-end}
.iact{
  width:22px;height:22px;display:grid;place-items:center;border-radius:var(--r);
  color:var(--ink2);border:1px solid transparent;transition:.1s linear;
}
.iact:hover{color:var(--ink);border-color:var(--line2);background:var(--panel3)}
.iact.del:hover{color:var(--bad);border-color:rgba(232,92,70,.4);background:var(--bad-soft)}
.iact svg{width:12px;height:12px}

/* 弹窗 */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,6,10,.68);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .14s linear;
  backdrop-filter:blur(2px);
}
.modal-overlay.on{opacity:1;pointer-events:auto}
.modal-box{
  width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  box-shadow:0 24px 64px -24px rgba(0,0,0,.9);
  transform:translateY(6px);transition:transform .16s ease-out;
}
.modal-overlay.on .modal-box{transform:none}
.modal-box.wide{max-width:720px}
.modal-hd{
  display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--line);
}
.modal-hd h3{font-size:14px;font-weight:600;flex:1}
.modal-hd .x{color:var(--ink3);width:24px;height:24px;display:grid;place-items:center;border-radius:var(--r)}
.modal-hd .x:hover{background:var(--panel3);color:var(--ink)}
.modal-bd{padding:16px 18px;overflow-y:auto}
.modal-ft{
  display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;
  border-top:1px solid var(--line);background:var(--panel2);
}
.modal-ft .hint{margin-right:auto;align-self:center;font-size:11px;color:var(--ink3)}

/* 表单 */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11px;color:var(--ink2);display:flex;gap:3px;align-items:center}
.fld label .req{color:var(--bad);font-family:var(--mono)}
.fld input,.fld select,.fld textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r);color:var(--ink);font-family:inherit;font-size:12.5px;
  padding:6px 8px;outline:none;transition:border-color .12s linear;
}
.fld textarea{resize:vertical;min-height:60px;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--amber)}
.fld .tip{font-size:10.5px;color:var(--ink3)}
.fld.err input,.fld.err select,.fld.err textarea{border-color:var(--bad);background:var(--bad-soft)}
.fld .msg{font-size:10.5px;color:var(--bad);display:none}
.fld.err .msg{display:block}
.draft-note{
  font-size:10.5px;color:var(--warn);font-family:var(--mono);
  display:none;align-items:center;gap:5px;
}
.draft-note.on{display:flex}

/* 导入 */
.imp-tabs{display:flex;gap:6px;margin-bottom:12px}
.imp-tabs button{
  font-size:11.5px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink2);background:var(--panel2);
}
.imp-tabs button.on{color:var(--amber);border-color:rgba(240,160,48,.4);background:var(--amber-soft)}
.imp-area{
  width:100%;min-height:160px;font-family:var(--mono);font-size:11.5px;line-height:1.7;
  background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);padding:10px;outline:none;resize:vertical;
}
.imp-area:focus{border-color:var(--amber)}
.imp-preview{margin-top:12px;font-size:11.5px;color:var(--ink2);line-height:1.8}
.imp-preview b{color:var(--ink);font-family:var(--mono)}
.imp-preview .bad{color:var(--bad)}
.imp-preview .ok{color:var(--good)}

/* toast */
#toast-root{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r);
  padding:8px 14px;font-size:12px;color:var(--ink);box-shadow:0 12px 32px -12px rgba(0,0,0,.8);
  opacity:0;transform:translateY(6px);transition:.16s ease-out;white-space:nowrap;
}
.toast.on{opacity:1;transform:none}
.toast.ok{border-color:rgba(49,196,141,.45)}
.toast.bad{border-color:rgba(232,92,70,.5)}

/* 目标值条 */
.cfg-bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:9px 14px;margin-bottom:14px;
}
.cfg-bar .lbl{font-size:11px;color:var(--ink3);font-family:var(--mono);letter-spacing:.06em}
.cfg-bar label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.cfg-bar input{
  width:52px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  color:var(--ink);font-family:var(--mono);font-size:11.5px;padding:3px 6px;outline:none;text-align:right;
}
.cfg-bar input:focus{border-color:var(--amber)}
.cfg-bar .sep{color:var(--line2)}

/* 空态 */
.empty-block{
  border:1px dashed var(--line2);border-radius:var(--r);padding:30px 20px;text-align:center;
  color:var(--ink3);font-size:12px;line-height:1.9;
}
.empty-block b{color:var(--ink2);font-weight:500;display:block;margin-bottom:4px;font-size:13px}
.empty-block .btn{margin-top:10px}

@media (max-width:860px){
  .fgrid{grid-template-columns:1fr}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal-box{max-width:none;max-height:88vh;border-radius:var(--r) var(--r) 0 0}
  .cfg-bar{gap:10px}
}

/* 店铺卡悬浮操作 */
.scard .nm{justify-content:space-between}
.scard-acts{opacity:.38;transition:opacity .12s linear;flex:0 0 auto}
.scard:hover .scard-acts,.scard:focus-within .scard-acts{opacity:1}
@media (hover:none){.scard-acts{opacity:1}}

/* 示例数据提示条 */
.seed-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid rgba(229,178,60,.35);border-radius:var(--r);
  background:var(--warn-soft);padding:8px 13px;margin-bottom:16px;
  font-size:11.5px;color:var(--warn);
}
.seed-bar b{color:var(--warn)}
.seed-bar .btn{margin-left:auto;font-size:11px;padding:3px 9px}

@media (max-width:860px){
  .sec-head{flex-wrap:wrap;gap:8px 10px}
  .sec-head h2{white-space:nowrap}
  .sec-head .sub{order:3;flex:1 1 100%;font-size:11px}
  .sec-head .head-actions{order:2;margin-left:auto}
  .head-actions .btn{font-size:11px;padding:4px 9px}
  .seed-bar{font-size:11px}
  .seed-bar .btn{margin-left:0}
}

/* ============ v3 配色：浅青（取自用户截图 2026-11-11） ============ */
/* 截图取色：#246B78 主色 / #E5F4F7 底 / #E6F4F6 选中 / #B23A2F 红 / #BE8F1C 琥珀 / #C3DFE5 线 */

html[data-theme="light"]{
  --bg:#E9F5F8;
  --panel:#FFFFFF;
  --panel2:#F5FBFC;
  --panel3:#E6F4F6;
  --shell:#F2FAFB;
  --line:#D8E9ED;
  --line2:#BEDDE3;
  --ink:#0A1A20;
  --ink2:#4A5C64;
  --ink3:#7A8B92;
  --amber:#246B78;
  --amber-soft:#E3F2F5;
  --good:#17785A;
  --good-soft:#E3F3EC;
  --warn:#BE8F1C;
  --warn-soft:#FCF3D9;
  --bad:#B23A2F;
  --bad-soft:#FCF3F2;
  --info:#2A82BE;
  --info-soft:#E8F2FB;
  --grid:#DBE9ED;
  --accent-panel:#E8F6F8;
  --accent-line:#C3DFE5;
  --edge:rgba(36,107,120,.26);
  --shadow:0 1px 2px rgba(10,26,32,.04), 0 10px 24px -20px rgba(10,26,32,.35);
}

html[data-theme="dark"]{
  --bg:#061418;
  --panel:#0B2027;
  --panel2:#0F2A32;
  --panel3:#133841;
  --shell:#0A1D23;
  --line:#173138;
  --line2:#22454E;
  --ink:#E6F2F4;
  --ink2:#9CB3B9;
  --ink3:#6A8188;
  --amber:#54B6C6;
  --amber-soft:rgba(84,182,198,.14);
  --good:#3CC08D;
  --good-soft:rgba(60,192,141,.13);
  --warn:#D9A93C;
  --warn-soft:rgba(217,169,60,.13);
  --bad:#E06A5C;
  --bad-soft:rgba(224,106,92,.13);
  --info:#4A9BD8;
  --info-soft:rgba(78,158,220,.13);
  --grid:#1B353D;
  --accent-panel:rgba(84,182,198,.09);
  --accent-line:rgba(84,182,198,.28);
  --edge:rgba(84,182,198,.30);
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 28px -18px rgba(0,0,0,.85);
}

html[data-theme="light"] body{
  background-color:var(--bg);
  background-image:linear-gradient(165deg,#F0F9FB 0%,#E4F3F7 52%,#DBEFF3 100%);
  background-attachment:fixed;
}

/* 浅色主题下把旧的写死 rgba 描边换成新色 */
html[data-theme="light"] .chip.p0{border-color:rgba(178,58,47,.24)}
html[data-theme="light"] .chip.p1{border-color:rgba(190,143,28,.26)}
html[data-theme="light"] .chip.p2{border-color:rgba(42,130,190,.24)}
html[data-theme="light"] .chip.ok{border-color:rgba(23,120,90,.24)}
html[data-theme="light"] .btn.danger{border-color:rgba(178,58,47,.35)}
.rail,.topbar{background:var(--shell)}
.nav button.on{background:var(--panel3)}
.chip.amber{border-color:var(--edge)}
.btn.danger{border-color:var(--edge)}
.iact.del:hover{border-color:var(--edge)}

/* 预警 KPI：整格不加底色，只让数字着色（对齐参考截图的干净 KPI 条） */
.kpi.alert{background:transparent;box-shadow:none}
.kpi.warn{background:transparent;box-shadow:none}
.kpi.good{background:transparent;box-shadow:none}
html[data-theme="light"] .kpi.alert .v{color:var(--bad)}
html[data-theme="light"] .kpi.warn .v{color:#9A7314}
html[data-theme="light"] .kpi.good .v{color:var(--good)}

/* 洞察块：淡青填充 + 左侧主色条 */
.insight{
  background:var(--accent-panel);
  border-color:var(--accent-line);
  border-top:1px solid var(--accent-line);
  border-left:2px solid var(--amber);
}
html[data-theme="light"] .insight h3{color:var(--ink)}
html[data-theme="light"] .arow .t{color:var(--ink)}

/* 主按钮：浅色主题下用白字，深色主题下用深字（主色偏亮） */
html[data-theme="light"] .btn.primary{color:#fff}
html[data-theme="light"] .btn.primary:hover{filter:brightness(.94)}
html[data-theme="dark"] .btn.primary{color:#06232A}

/* 表格/卡片描边换成淡青 */
html[data-theme="light"] .tbl-wrap table th{background:var(--panel2)}
html[data-theme="light"] .scard.hot{border-color:var(--edge)}

/* 预警行按优先级左侧色条 + 极淡底色（对齐参考截图） */
html[data-theme="light"] .arow{box-shadow:inset 3px 0 0 transparent}
html[data-theme="light"] .arow[data-lv="P0"]{background:var(--bad-soft);box-shadow:inset 3px 0 0 var(--bad)}
html[data-theme="light"] .arow[data-lv="P1"]{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
html[data-theme="light"] .arow[data-lv="P2"]{background:var(--panel);box-shadow:inset 3px 0 0 var(--line2)}
html[data-theme="light"] .arow:hover{filter:brightness(.985)}
html[data-theme="dark"] .arow[data-lv="P0"]{box-shadow:inset 3px 0 0 var(--bad)}
html[data-theme="dark"] .arow[data-lv="P1"]{box-shadow:inset 3px 0 0 var(--warn)}
html[data-theme="dark"] .arow[data-lv="P2"]{box-shadow:inset 3px 0 0 var(--line2)}

/* ============ 店铺库 v3：平台分组 + 缺口筛选 + 行内账号 ============ */
.mono{font-family:var(--mono)}
.dim{color:var(--ink3)}
.miss{color:var(--bad);font-size:11px}

/* 信号格（店铺库 5 格） */
.store-stats{
  display:grid;grid-template-columns:repeat(5,1fr);gap:0;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--panel);margin-bottom:14px;
}
.store-stats .ss{
  padding:12px 16px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;min-width:0;
}
.store-stats .ss:last-child{border-right:none}
.store-stats .ss em{font-style:normal;font-size:10.5px;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase}
.store-stats .ss b{font-family:var(--mono);font-size:22px;line-height:1.15;font-weight:500;color:var(--ink)}
.store-stats .ss i{font-style:normal;font-size:10.5px;color:var(--ink3)}
.store-stats .ss.warn b{color:var(--bad)}
.store-stats .ss.warn i{color:var(--bad)}

/* 平台分组 */
.sgroup{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:10px;overflow:hidden}
.sg-head{
  display:flex;align-items:center;gap:9px;padding:0 14px;height:42px;
  cursor:pointer;user-select:none;transition:background .1s linear;
}
.sg-head:hover{background:var(--panel2)}
.sg-head:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.sg-caret{display:flex;color:var(--ink3);transition:transform .15s ease;flex:0 0 auto}
.sg-caret svg{width:13px;height:13px;display:block}
.sgroup.open .sg-caret{transform:rotate(90deg)}
.sg-name{font-size:13px;font-weight:500;color:var(--ink)}
.sg-meta{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.sg-pill{
  font-family:var(--mono);font-size:10.5px;line-height:1;
  padding:3px 7px;border-radius:3px;border:1px solid var(--line2);
  color:var(--ink2);background:var(--panel2);white-space:nowrap;
}
.sg-pill.key{color:var(--amber);border-color:var(--accent-line);background:var(--amber-soft)}
.sg-pill.warn{color:var(--bad);border-color:rgba(178,58,47,.22);background:var(--bad-soft)}
.sg-body{display:none;border-top:1px solid var(--line)}
.sgroup.open .sg-body{display:block}
.sg-body .tbl-wrap{border:none;border-radius:0}

/* 店铺表 */
.store-tbl{width:100%;border-collapse:collapse;font-size:12px}
.store-tbl th{
  text-align:left;font-weight:400;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink3);padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.store-tbl th.n,.store-tbl td.n{text-align:right}
.store-tbl td{padding:0 12px;height:38px;border-bottom:1px solid var(--line);vertical-align:middle}
.store-tbl tr:last-child td{border-bottom:none}
.store-tbl tbody tr:hover{background:var(--panel2)}
.store-tbl tr.is-open{background:var(--accent-panel)}
.s-name{position:relative;white-space:nowrap}
.s-toggle{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;padding:0;
  font:inherit;color:var(--ink);cursor:pointer;text-align:left;max-width:100%;
}
.s-toggle:hover .nm{color:var(--amber)}
.s-toggle .caret{display:flex;color:var(--ink3);transition:transform .15s ease;flex:0 0 auto}
.s-toggle .caret svg{width:11px;height:11px;display:block}
tr.is-open .s-toggle .caret{transform:rotate(90deg)}
.s-toggle .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-toggle .chip{font-size:9.5px;padding:1px 5px;flex:0 0 auto}
.acct-flag{
  font-family:var(--mono);font-size:9.5px;color:var(--ink3);
  border:1px solid var(--line2);border-radius:3px;padding:1px 4px;margin-left:7px;
  background:var(--panel2);white-space:nowrap;
}
.srow td:last-child{width:1%;white-space:nowrap}

/* 账号明细面板 */
.acct-detail>td{padding:0 !important;background:var(--panel2);border-bottom:1px solid var(--line)}
.acct-panel{padding:14px 16px 16px}
.acct-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.acct-title{font-size:12.5px;font-weight:500;color:var(--ink)}
.acct-sub{font-size:10.5px;color:var(--ink3);margin-bottom:10px;line-height:1.6}
.acct-tbl{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--panel)}
.acct-tbl th{
  text-align:left;font-weight:400;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink3);padding:6px 10px;border-bottom:1px solid var(--line);
  background:var(--panel3);white-space:nowrap;
}
.acct-tbl td{padding:0 10px;height:34px;border-bottom:1px solid var(--line);white-space:nowrap}
.acct-tbl tr:last-child td{border-bottom:none}
.acct-tbl tbody tr:hover{background:var(--panel2)}
.acct-tbl .strip{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.acct-tbl .acct-empty{
  height:auto;padding:16px 10px;text-align:center;color:var(--ink3);font-size:11.5px;white-space:normal;
}
.acct-panel .tbl-wrap{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.acct-tbl{min-width:960px}

@media (max-width:860px){
  .store-stats{grid-template-columns:repeat(2,1fr)}
  .store-stats .ss{border-right:none;border-bottom:1px solid var(--line)}
  .store-stats .ss:nth-child(odd){border-right:1px solid var(--line)}
  .store-stats .ss b{font-size:19px}
  .store-tbl th,.store-tbl td{padding-left:9px;padding-right:9px}
  .store-tbl th:nth-child(4),.store-tbl td:nth-child(4){display:none}
  .sg-head{padding:0 11px;height:auto;min-height:42px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .sg-meta{margin-left:23px;justify-content:flex-start;width:100%}
  .acct-panel{padding:12px}
  .acct-tbl th:nth-child(5),.acct-tbl td:nth-child(5),
  .acct-tbl th:nth-child(6),.acct-tbl td:nth-child(6){display:none}
}

/* 操作列固定宽度，避免图标挤压 */
.store-tbl td:last-child{padding-left:0;padding-right:10px;width:62px}
.store-tbl .acts{justify-content:flex-end}
/* 展开行高亮 */
.store-tbl tr.srow.is-open{background:var(--accent-panel);box-shadow:inset 3px 0 0 var(--amber)}
/* 重点标签弱化 */
.s-toggle .chip.amber{
  background:transparent;border-color:var(--accent-line);color:var(--amber);
  opacity:.9;letter-spacing:.02em;
}

   存储：团队云端共享（Supabase 直连，与「远山驾驶舱」同一套方式）
   打开链接即用，不需要登录；所有人读写同一条云端记录，改一处全组可见。
   写操作只做差分 upsert / delete，不整库覆盖，避免互相冲掉。
   云端不可达时自动落本地缓存，页面照常可用，联网后再推上去。
   密码类信息不再进入工作台：账号只记「绑定人 + 手机后四位」。
   ========================================================= */
const LS_CFG = 'wb.signal.v3.cfg';
const LS_DB = 'wb.signal.v3.db';
const LS_ME = 'wb.signal.v3.me';
const DB_VER = 4;
const KINDS = ['shops', 'metrics', 'accounts', 'alerts', 'tasks', 'qc', 'assets', 'apis'];
const PAGE_ROWS = 1000;

/* 云配置由构建脚本注入：{ url, key, recTable, kvTable } */
const cloud = (function () {
  const cfg = window.__OPS_CFG__ || {};
  if (!cfg.url || !cfg.key) return null;
  return {
    url: String(cfg.url).replace(/\/+$/, ''),
    key: cfg.key,
    rec: cfg.recTable || 'ops_records',
    kv: cfg.kvTable || 'ops_kv'
  };
})();

function sbHeaders(extra) {
  const h = { apikey: cloud.key, Authorization: 'Bearer ' + cloud.key, 'Content-Type': 'application/json' };
  return Object.assign(h, extra || {});
}
async function sbFetch(path, opt) {
  const r = await fetch(cloud.url + '/rest/v1/' + path, opt);
  if (!r.ok) {
    let msg = 'HTTP ' + r.status;
    try {
      const j = await r.json();
      msg = j.message || j.hint || j.details || msg;
    } catch (e) {}
    const err = new Error(msg);
    err.status = r.status;
    throw err;
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function dbSelectAll() {
  if (!cloud) return [];
  const out = [];
  for (let from = 0; ; from += PAGE_ROWS) {
    const rows = (await sbFetch(
      cloud.rec + '?select=key,coll,rec_id,data&order=key.asc&limit=' + PAGE_ROWS + '&offset=' + from,
      { headers: sbHeaders() }
    )) || [];
    out.push.apply(out, rows);
    if (rows.length < PAGE_ROWS) break;
  }
  return out;
}
async function kvGet(k) {
  if (!cloud) return null;
  const rows = (await sbFetch(cloud.kv + '?select=v&k=eq.' + encodeURIComponent(k), { headers: sbHeaders() })) || [];
  return rows.length ? rows[0].v : null;
}
async function kvSet(k, v) {
  if (!cloud) return;
  await sbFetch(cloud.kv + '?on_conflict=k', {
    method: 'POST',
    headers: sbHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ k: k, v: v, updated_at: new Date().toISOString() }])
  });
}

const store = {
  db: { meta: {} },
  cfg: { targets: { adopt: 60, gen: 75, conv: 40, resp: 98 }, range: 14 },
  session: null,
  cfgMeta: { at: 0, by: '' },   // 配置最后修改人/时间（团队共享）
  synced: {},        // key -> 上次同步时的 JSON 快照
  _timer: 0, _flushing: null, _again: false, _cfgTimer: 0,

  /* 启动时只读本地缓存兜底，云端才是准的（loadCfg 会覆盖） */
  initCfg() {
    let c = null;
    try { c = localStorage.getItem(LS_CFG); } catch (e) {}
    if (c) { try {
      const o = JSON.parse(c) || {};
      if (o.targets) Object.assign(this.cfg.targets, o.targets);
      if (o.range) this.cfg.range = +o.range;
    } catch (e) {} }
  },
  cfgCache() { try { localStorage.setItem(LS_CFG, JSON.stringify(this.cfg)); } catch (e) {} },

  /* 从云端读团队配置；云端还没有就写默认值上去 */
  async loadCfg() {
    let c = null, reachable = false;
    try { c = await kvGet('cfg'); reachable = !!cloud; } catch (e) { reachable = false; }
    if (reachable && c && c.targets) {
      Object.assign(this.cfg.targets, c.targets);
      if (c.range) this.cfg.range = +c.range;
      this.cfgMeta = { at: +c.at || 0, by: c.by || '' };
      this.cfgCache();
    } else if (reachable && c === null) {
      await this.pushCfg(true);
    }
  },
  /* 改配置：本地缓存即时生效，400ms 后写云端，全组同步 */
  saveCfg() {
    this.cfgCache();
    clearTimeout(this._cfgTimer);
    this._cfgTimer = setTimeout(() => { this.pushCfg(); }, 400);
  },
  async pushCfg(silent) {
    const blob = { targets: this.cfg.targets, range: this.cfg.range, at: Date.now(), by: myName() };
    try {
      await kvSet('cfg', blob);
      this.cfgMeta = { at: blob.at, by: blob.by };
      const el = document.getElementById('cfgSync');
      if (el) el.textContent = cfgSyncText();
    } catch (e) {
      this.cloudErr = (e && e.message) || String(e);
      if (!silent) toast('配置同步失败：' + this.cloudErr, 'bad');
    }
  },

  /* 本机缓存：云端连不上时的兜底，也让首屏更快 */
  readLocal() {
    try {
      const raw = localStorage.getItem(LS_DB);
      if (!raw) return null;
      const o = JSON.parse(raw);
      const db = o && o.db;
      if (!db || !KINDS.some(k => Array.isArray(db[k]))) return null;
      const out = { meta: db.meta || { ver: DB_VER } };
      KINDS.forEach(k => { out[k] = Array.isArray(db[k]) ? db[k] : []; });
      return out;
    } catch (e) { return null; }
  },
  cacheLocal() {
    try { localStorage.setItem(LS_DB, JSON.stringify({ db: this.db, at: Date.now() })); } catch (e) {}
  },

  /* 拉全量：云端优先；云挂了读本机缓存；都没有才播种子 */
  async hydrate(opts) {
    let rows = null;
    this.cloudErr = '';
    if (cloud) {
      try { rows = await dbSelectAll(); }
      catch (e) { this.cloudErr = (e && e.message) || String(e); rows = null; }
    }
    this.synced = {};
    if (rows === null) {
      const local = this.readLocal();
      if (local) {
        this.db = local;
        await this.loadCfg();
        return { seeded: false, rows: 0, offline: !!cloud };
      }
      rows = [];
    }
    if (!rows.length) return (opts && opts.noSeed) ? { seeded: false, rows: 0 } : this.seedFresh();
    const db = { meta: {} };
    KINDS.forEach(k => { db[k] = []; });
    rows.forEach(r => {
      if (KINDS.indexOf(r.coll) < 0) return;
      db[r.coll].push(r.data);
      this.synced[r.key] = JSON.stringify(r.data);
    });
    this.db = db;
    this.db.meta = (await kvGet('meta').catch(() => null)) || { ver: DB_VER };
    await this.loadCfg();
    this.cacheLocal();
    return { seeded: false, rows: rows.length };
  },
  async seedFresh() {
    const s = buildSeed();
    this.db = Object.assign({ meta: { ver: DB_VER, seed: true, seededAt: todayStr() } }, s);
    this.synced = {};
    await this.flush();
    await kvSet('meta', this.db.meta);
    await this.loadCfg();
    return { seeded: true, rows: Object.keys(this.synced).length };
  },

  /* 写：300ms 合并一次，只推变化的行 */
  save() {
    clearTimeout(this._timer);
    this._lastWrite = Date.now();
    this._timer = setTimeout(() => { this.flush(); }, 300);
  },
  async flush() {
    if (!cloud) { this.cacheLocal(); return; }
    if (this._flushing) { this._again = true; return this._flushing; }
    this._flushing = (async () => {
      do {
        this._again = false;
        const ups = [], seen = {};
        KINDS.forEach(k => (this.db[k] || []).forEach(rec => {
          if (!rec || !rec.id) return;
          const key = k + ':' + rec.id;
          seen[key] = 1;
          const j = JSON.stringify(rec);
          if (this.synced[key] !== j) {
            ups.push({ key: key, coll: k, rec_id: String(rec.id), data: rec, updated_at: new Date().toISOString(), updated_by: myName() });
          }
        }));
        const dels = Object.keys(this.synced).filter(k => !seen[k]);
        for (let i = 0; i < ups.length; i += 200) {
          const part = ups.slice(i, i + 200);
          await sbFetch(cloud.rec + '?on_conflict=key', {
            method: 'POST',
            headers: sbHeaders({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
            body: JSON.stringify(part)
          });
          part.forEach(u => { this.synced[u.key] = JSON.stringify(u.data); });
        }
        for (let i = 0; i < dels.length; i += 200) {
          const part = dels.slice(i, i + 200);
          await sbFetch(cloud.rec + '?key=in.(' + part.join(',') + ')', {
            method: 'DELETE',
            headers: sbHeaders({ Prefer: 'return=minimal' })
          });
          part.forEach(k => { delete this.synced[k]; });
        }
      } while (this._again);
    })().catch(e => {
      this.cloudErr = (e && e.message) || String(e);
      /* 用顶部常驻提示代替红条 toast，避免每次改动都弹一次 */
      if (typeof syncNotice === 'function') syncNotice();
    }).finally(() => {
      this._flushing = null;
      this._lastWrite = Date.now();
      this.cacheLocal();
    });
    return this._flushing;
  },

  list(k) { return (this.db[k] || []).slice(); },
  get(k, id) { return (this.db[k] || []).find(x => x.id === id) || null; },
  add(k, obj) {
    const rec = Object.assign({ id: uid(k[0]) }, obj);
    this.db[k].unshift(rec); this.save(); return rec;
  },
  update(k, id, patch) {
    const r = this.get(k, id); if (!r) return null;
    Object.assign(r, patch); this.save(); return r;
  },
  remove(k, id) {
    this.db[k] = this.db[k].filter(x => x.id !== id); this.save();
  },
  upsertMetric(rec) {
    const hit = this.db.metrics.find(m => m.shop === rec.shop && m.date === rec.date);
    if (hit) { Object.assign(hit, rec); this.save(); return 'update'; }
    this.db.metrics.push(Object.assign({ id: uid('m') }, rec)); this.save(); return 'insert';
  },
  clearAll() {
    KINDS.forEach(k => { this.db[k] = []; });
    this.db.meta = { seed: false, ver: DB_VER };
    this.save();
  }
};

/* 「我是谁」：记在本机、不进云端；写库时带上改动人，方便追溯是谁改的。
   打开即用，不需要登录，名字只用于标记。 */
function myName() {
  try {
    const n = localStorage.getItem(LS_ME);
    if (n) return n;
  } catch (e) {}
  return '组内成员';
}
function setMyName(n) {
  const v = String(n || '').trim().slice(0, 20);
  try {
    if (v) localStorage.setItem(LS_ME, v); else localStorage.removeItem(LS_ME);
  } catch (e) {}
  return v || '组内成员';
}
function agoText(ts) {
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function cfgSyncText() {
  const m = store.cfgMeta || {};
  const who = m.by ? m.by + ' ' : '';
  const when = m.at ? agoText(m.at) : '未同步';
  return '团队云端 · ' + who + when + '更新 · ' + store.list('metrics').length + ' 条指标';
}

/* ---------- 聚合 ---------- */
const agg = {
  shopNames() {
    const s = new Set(store.list('shops').map(x => x.name).filter(Boolean));
    store.list('metrics').forEach(m => m.shop && s.add(m.shop));
    return Array.from(s).sort();
  },
  owners() {
    const s = new Set(store.list('shops').map(x => x.owner).filter(Boolean));
    return Array.from(s).sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
  },
  /* 账号角色词表：固定常用 + 数据里实际出现的 */
  roles() {
    const base = ['娟娟', '居居', '探域', '申诉', '小娟', '小居', '瑶瑶', '小杨', '栩栩', '只只', '笑笑', '主账号'];
    const s = new Set(base);
    store.list('accounts').forEach(a => { if (a.role) s.add(a.role); });
    return Array.from(s);
  },
  /* 每店的账号列表 */
  accountsByShop() {
    const map = {};
    store.list('accounts').forEach(a => {
      const k = a.shop;
      if (!k) return;
      (map[k] = map[k] || []).push(a);
    });
    return map;
  },
  dates() {
    const s = new Set(store.list('metrics').map(m => m.date).filter(Boolean));
    return Array.from(s).sort().reverse();
  },
  /* 每店最新一条 */
  latestByShop() {
    const map = {};
    store.list('metrics').forEach(m => {
      if (!m.shop || !m.date) return;
      if (!map[m.shop] || m.date > map[m.shop].date) map[m.shop] = m;
    });
    return map;
  },
  /* 某天各店均值 */
  dayAvg(date) {
    const recs = store.list('metrics').filter(m => m.date === date);
    const out = {};
    M_KEYS.forEach(k => { out[k] = avg(recs.map(m => num(m[k]))); });
    out._n = recs.length;
    return out;
  },
  /* 六项：近 7 天 vs 前 7 天 */
  sixStats() {
    const ds = agg.dates();
    const cur = ds.slice(0, 7), prev = ds.slice(7, 14);
    const meanOf = arr => {
      const recs = store.list('metrics').filter(m => arr.indexOf(m.date) >= 0);
      const o = {};
      M_KEYS.forEach(k => { o[k] = avg(recs.map(m => num(m[k]))); });
      return o;
    };
    const a = meanOf(cur), b = meanOf(prev);
    return METRICS.map(def => ({ def, cur: a[def.k], prev: b[def.k] }));
  },
  /* 近 n 天序列 */
  series(n) {
    const ds = agg.dates().slice(0, n).reverse();
    return ds.map(d => Object.assign({ date: d }, agg.dayAvg(d)));
  },
  /* 未达标店铺 */
  breaches() {
    const latest = agg.latestByShop(), T = store.cfg.targets, out = [];
    Object.keys(latest).forEach(shop => {
      const m = latest[shop];
      METRICS.forEach(def => {
        if (!def.tgt) return;
        const v = num(m[def.k]);
        if (v == null) return;
        if (def.hi ? v < T[def.tgt] : v > T[def.tgt]) {
          out.push({ shop, metric: def.l, k: def.k, v, tgt: T[def.tgt], gap: +(v - T[def.tgt]).toFixed(1) });
        }
      });
    });
    return out.sort((x, y) => Math.abs(y.gap) - Math.abs(x.gap));
  },
  counts() {
    const alerts = store.list('alerts');
    const tasks = store.list('tasks');
    const qc = store.list('qc');
    const apis = store.list('apis');
    const shops = store.list('shops');
    const latest = agg.latestByShop();
    const bad = Object.keys(latest).filter(s => agg.breaches().some(b => b.shop === s)).length;
    return {
      alertOpen: alerts.filter(a => a.status !== '已处理').length,
      badShops: bad,
      shops: shops.length,
      keyShops: shops.filter(s => s.tag === '重点').length,
      records: store.list('metrics').length,
      tasksTodo: tasks.filter(t => t.status !== '已完成').length,
      qcActive: qc.filter(q => q.status === '生效中').length,
      apiDown: apis.filter(a => a.status !== '正常').length,
      assets: store.list('assets').length
    };
  },
  /* 规则化洞察：找最该修的店 + 原因 */
  insight() {
    const latest = agg.latestByShop(), T = store.cfg.targets;
    const rows = Object.keys(latest).map(shop => {
      const m = latest[shop], v = num(m.adopt);
      return { shop, v, gap: v == null ? -999 : v - T.adopt, rec: m };
    }).filter(r => r.v != null).sort((a, b) => a.v - b.v);
    if (!rows.length) return null;
    const worst = rows[0];
    const below = rows.filter(r => r.v < T.adopt).length;
    return { worst, below, total: rows.length };
  }
};

/* ---------- toast / modal ---------- */
function toast(msg, kind) {
  const root = $('#toast-root');
  if (!root) return;
  while (root.children.length >= 3) root.removeChild(root.firstChild);
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  root.appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => {
    t.classList.remove('on');
    setTimeout(() => t.remove(), 220);
  }, 2200);
}

let modalOnClose = null;
function openModal(cfg) {
  const root = $('#modal-root');
  root.innerHTML = `
    <div class="modal-overlay" id="moverlay">
      <div class="modal-box ${cfg.wide ? 'wide' : ''}" role="dialog" aria-modal="true">
        <div class="modal-hd">
          <h3>${esc(cfg.title)}</h3>
          <button class="x" data-close aria-label="关闭">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
        </div>
        <div class="modal-bd">${cfg.body || ''}</div>
        <div class="modal-ft">
          ${cfg.hint ? `<span class="hint">${cfg.hint}</span>` : ''}
          ${(cfg.buttons || []).map((b, i) => `<button class="btn ${b.cls || ''}" data-mb="${i}">${esc(b.label)}</button>`).join('')}
        </div>
      </div>
    </div>`;
  const ov = $('#moverlay');
  requestAnimationFrame(() => ov.classList.add('on'));
  const close = () => {
    ov.classList.remove('on');
    setTimeout(() => { root.innerHTML = ''; if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); } }, 150);
  };
  window.__closeModal = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', close));
  $$('[data-mb]', ov).forEach(b => b.addEventListener('click', () => {
    const spec = cfg.buttons[+b.dataset.mb];
    if (spec.fn) spec.fn(close, root); else close();
  }));
  document.addEventListener('keydown', function esc1(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc1); }
  });
  if (cfg.onMount) cfg.onMount(root, close);
  return { root, close };
}

function confirmDialog(title, text, onOk, okLabel) {
  openModal({
    title,
    body: `<div style="font-size:12.5px;line-height:1.8;color:var(--ink2)">${text}</div>`,
    buttons: [
      { label: '取消', cls: 'ghost' },
      { label: okLabel || '确认删除', cls: 'danger', fn: (close) => { close(); onOk(); } }
    ]
  });
}

function fieldHtml(f, val) {
  const v = val == null ? '' : val;
  const req = f.req ? '<span class="req">*</span>' : '';
  let ctl = '';
  if (f.t === 'select') {
    let opts = typeof f.opts === 'function' ? f.opts() : (f.opts || []);
    if (v && opts.indexOf(v) < 0) opts = [v].concat(opts);
    ctl = `<select name="${f.k}">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    ctl = `<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
  } else if (f.t === 'password') {
    ctl = `<div class="pw-field"><input name="${f.k}" type="password" value="${esc(v)}"
      autocomplete="new-password" spellcheck="false" /><button type="button" class="pw-eye" data-eye="${f.k}" title="显示 / 隐藏密码">${ICON.eye}</button></div>`;
  } else {
    ctl = `<input name="${f.k}" type="${f.t === 'num' ? 'number' : f.t === 'date' ? 'date' : 'text'}"
      ${f.t === 'num' ? 'step="0.1"' : ''} ${f.max ? `maxlength="${f.max}"` : ''} value="${esc(v)}" ${f.t === 'num' ? 'inputmode="decimal"' : ''} />`;
  }
  return `<div class="fld ${f.full ? 'full' : ''}" data-fld="${f.k}">
    <label>${esc(f.l)}${req}</label>
    ${ctl}
    ${f.tip ? `<span class="tip">${esc(f.tip)}</span>` : ''}
    <span class="msg">必填</span>
  </div>`;
}

const DRAFT_KEY = (kind, id) => 'wb.draft.' + kind + '.' + (id || 'new');

function openForm(kind, id, preset) {
  const def = FORMS[kind];
  if (!def) return;
  const rec = id ? Object.assign({}, store.get(def.key, id) || {}) : Object.assign({}, preset || {});
  if (!id) {
    const d = { date: todayStr(), status: kind === 'tasks' ? '待办' : kind === 'alerts' ? '待处理' : '', due: todayStr() };
    Object.keys(d).forEach(k => { if (def.fields.some(f => f.k === k) && !rec[k]) rec[k] = d[k]; });
  }
  const body = `<div class="fgrid" id="frm">
      ${def.fields.map(f => fieldHtml(f, rec[f.k])).join('')}
    </div>
    <div class="draft-note" id="draftNote">已恢复上次未提交的草稿</div>`;

  openModal({
    title: (id ? '编辑' : '新增') + def.title,
    body,
    hint: id ? '修改后立即保存到本地' : '直接填写，中途关闭会自动存草稿',
    buttons: [
      { label: '取消', cls: 'ghost' },
      { label: '保存', cls: 'primary', fn: (close, root) => submitForm(kind, id, root, close) }
    ],
    onMount: (root) => {
      const frm = $('#frm', root);
      const dk = DRAFT_KEY(kind, id);
      let draft = null;
      try { draft = JSON.parse(localStorage.getItem(dk) || 'null'); } catch (e) {}
      if (draft) {
        Object.keys(draft).forEach(k => {
          const el = frm.querySelector('[name="' + k + '"]');
          if (el) el.value = draft[k];
        });
        $('#draftNote', root).classList.add('on');
      }
      let timer = null;
      frm.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const o = {};
          $$('[name]', frm).forEach(el => { if (el.value) o[el.name] = el.value; });
          try { localStorage.setItem(dk, JSON.stringify(o)); } catch (e) {}
        }, 400);
      });
      const first = frm.querySelector('[name]');
      if (first && !draft) first.focus();
    }
  });
}

function submitForm(kind, id, root, close) {
  const def = FORMS[kind];
  const frm = $('#frm', root);
  const out = {};
  let bad = null;
  def.fields.forEach(f => {
    const el = frm.querySelector('[name="' + f.k + '"]');
    const wrap = frm.querySelector('[data-fld="' + f.k + '"]');
    let v = el ? String(el.value).trim() : '';
    wrap.classList.remove('err');
    if (f.req && !v) { wrap.classList.add('err'); bad = bad || f.l; }
    if (f.t === 'num') out[f.k] = v === '' ? null : num(v);
    else out[f.k] = v;
  });
  if (bad) { toast('请填写必填项：' + bad, 'bad'); return; }

  /* 尾号只留 4 位数字 */
  if (kind === 'accounts') out.tail = tail4(out.tail);

  if (kind === 'metrics') {
    store.upsertMetric(out);
  } else if (id) {
    store.update(def.key, id, out);
  } else {
    store.add(def.key, out);
  }
  try { localStorage.removeItem(DRAFT_KEY(kind, id)); } catch (e) {}
  close();
  toast((id ? '已保存' : '已新增') + def.title, 'ok');
  render();
}

   ========================================================= */
function parseTable(text) {
  const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim());
  if (lines.length < 2) return { rows: [], err: '至少需要表头 + 1 行数据' };
  const delim = lines[0].indexOf('\t') >= 0 ? '\t' : (lines[0].indexOf(',') >= 0 ? ',' : /\s{2,}/);
  const head = lines[0].split(delim).map(s => s.trim().replace(/^"|"$/g, ''));
  const map = head.map(h => HEAD_MAP[h] || HEAD_MAP[h.replace(/%$/, '')] || null);
  if (map.indexOf('shop') < 0 || map.indexOf('date') < 0) return { rows: [], err: '表头必须包含「店铺」和「日期」两列' };
  const rows = [], bad = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(delim).map(s => s.trim().replace(/^"|"$/g, ''));
    const o = {};
    cells.forEach((c, j) => {
      const k = map[j];
      if (!k) return;
      if (k === 'date') o.date = normDate(c);
      else if (k === 'shop' || k === 'note') o[k] = c;
      else o[k] = num(c);
    });
    if (!o.shop || !o.date) { bad.push(i + 1); continue; }
    rows.push(o);
  }
  return { rows, bad };
}

function normDate(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})$/);
  if (m) return new Date().getFullYear() + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
  return '';
}

function collectImport() {
  const txt = ($('#impText') || {}).value || '';
  const mode = (window.__impMode && window.__impMode()) || 'csv';
  if (!txt.trim()) return { rows: [], err: '内容为空' };
  if (mode === 'json' || /^\s*[\[{]/.test(txt)) {
    try {
      let arr = JSON.parse(txt);
      if (!Array.isArray(arr)) arr = arr.rows || arr.data || [];
      const rows = [], bad = [];
      arr.forEach((o, i) => {
        const r = {};
        Object.keys(o).forEach(k => {
          const kk = HEAD_MAP[k] || k;
          if (kk === 'date') r.date = normDate(o[k]);
          else if (kk === 'shop' || kk === 'note') r[kk] = String(o[k] || '');
          else if (M_KEYS.indexOf(kk) >= 0) r[kk] = num(o[k]);
        });
        if (!r.shop || !r.date) bad.push(i + 1); else rows.push(r);
      });
      return { rows, bad };
    } catch (e) { return { rows: [], err: 'JSON 解析失败：' + e.message }; }
  }
  return parseTable(txt);
}

function previewImport() {
  const box = $('#impPrev'); if (!box) return;
  const r = collectImport();
  if (r.err) { box.innerHTML = `<span class="bad">${esc(r.err)}</span>`; return; }
  if (!r.rows.length) { box.innerHTML = `<span class="bad">没有可导入的行</span>`; return; }
  const shops = new Set(r.rows.map(x => x.shop));
  const dates = Array.from(new Set(r.rows.map(x => x.date))).sort();
  const exist = r.rows.filter(x => store.list('metrics').some(m => m.shop === x.shop && m.date === x.date)).length;
  box.innerHTML = `可导入 <b>${r.rows.length}</b> 条 · 涉及 <b>${shops.size}</b> 家店 ·
    日期 <b>${esc(dates[0])}</b> → <b>${esc(dates[dates.length - 1])}</b><br>
    新增 <b class="ok">${r.rows.length - exist}</b> 条 · 覆盖 <b>${exist}</b> 条
    ${r.bad && r.bad.length ? ` · <span class="bad">${r.bad.length} 行缺店铺或日期已跳过（第 ${r.bad.slice(0, 5).join('、')} 行）</span>` : ''}`;
}

function doImport(close) {
  const r = collectImport();
  if (r.err || !r.rows.length) { toast(r.err || '没有可导入的行', 'bad'); return; }
  let ins = 0, upd = 0, newShops = 0;
  const known = new Set(store.list('shops').map(s => s.name));
  r.rows.forEach(x => {
    if (!known.has(x.shop)) {
      store.add('shops', {
        name: x.shop, platform: '未分类', account: '', owner: '未分配',
        tag: '常规', auth: '未授权', opstat: '运营中', third: '', note: '由指标导入自动建档，待补全'
      });
      known.add(x.shop); newShops++;
    }
    const t = store.upsertMetric(x);
    t === 'insert' ? ins++ : upd++;
  });
  store.save();
  if (store.db.meta && store.db.meta.seed) { store.db.meta = { seed: false }; store.save(); }
  close();
  toast(`导入完成：新增 ${ins} · 覆盖 ${upd}${newShops ? ` · 新建店铺 ${newShops}` : ''}`, 'ok');
  render();
}

/* ---------- 图表 ---------- */
const C = { w: 760, h: 242, pl: 38, pr: 60, pt: 18, pb: 30 };
let chartData = [];

function buildChart(series) {
  if (!series.length) return `<div class="empty-block" style="margin:4px 0"><b>还没有指标数据</b>点右上「导入指标」粘贴 OMS 导出的表格，或手动录入一条</div>`;
  const vals = [];
  series.forEach(s => { [s.adopt, s.gen].forEach(v => { if (v != null) vals.push(v); }); });
  const T = store.cfg.targets;
  const tvals = vals.concat([T.adopt, T.gen]);
  let lo = Math.floor((Math.min.apply(null, tvals) - 2) / 4) * 4;
  let hi = Math.ceil((Math.max.apply(null, tvals) + 2) / 4) * 4;
  if (hi - lo < 8) hi = lo + 8;

  const iw = C.w - C.pl - C.pr, ih = C.h - C.pt - C.pb;
  const x = i => C.pl + (series.length === 1 ? iw / 2 : (iw / (series.length - 1)) * i);
  const y = v => C.pt + ih - ((v - lo) / (hi - lo)) * ih;

  const path = arr => arr.map((v, i) => v == null ? '' : `${i ? 'L' : 'M'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).filter(Boolean).join(' ');

  let gl = '';
  let step = (hi - lo) / 6;
  step = [1, 2, 2.5, 5, 10, 20].find(s => s >= step - 0.001) || 20;
  for (let v = lo; v <= hi + 0.001; v += step) {
    if (Math.abs(v - Math.round(v)) > 0.001) continue;
    gl += `<line class="gl${v === lo ? ' zero' : ''}" x1="${C.pl}" y1="${y(v)}" x2="${C.w - C.pr}" y2="${y(v)}"/>
      <text x="${C.pl - 8}" y="${y(v) + 3.5}" text-anchor="end">${Math.round(v)}</text>`;
  }
  const skip = Math.ceil(series.length / 7);
  let xl = '';
  series.forEach((s, i) => {
    if (i % skip === 0 || i === series.length - 1) {
      xl += `<text x="${x(i)}" y="${C.h - 8}" text-anchor="middle">${esc(s.date.slice(5))}</text>`;
    }
  });

  const adopt = series.map(s => s.adopt), gen = series.map(s => s.gen);
  const lastI = series.length - 1;
  const dots = (arr, color) => arr.map((v, i) => v == null ? '' : `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="${series.length > 20 ? 1.6 : 2.2}" fill="${color}"/>`).join('');

  const tl = (v) => `<line class="target" x1="${C.pl}" y1="${y(v)}" x2="${C.w - C.pr}" y2="${y(v)}"/>`;

  const hover = series.map((s, i) => {
    const w = series.length > 1 ? iw / (series.length - 1) : iw;
    return `<rect class="hv" data-i="${i}" x="${x(i) - w / 2}" y="${C.pt}" width="${w}" height="${ih}" fill="transparent"/>`;
  }).join('');

  chartData = series;

  return `<svg class="chart" viewBox="0 0 ${C.w} ${C.h}" role="img" aria-label="采纳率与生成率趋势">
    <g class="axis">${gl}${xl}</g>
    ${isIn(T.gen, lo, hi) ? tl(T.gen) : ''}
    ${isIn(T.adopt, lo, hi) ? tl(T.adopt) : ''}
    <path class="line-b" d="${path(gen)}"/>
    <path class="line-a" d="${path(adopt)}"/>
    ${dots(gen, 'var(--info)')}
    ${dots(adopt, 'var(--amber)')}
    ${adopt[lastI] != null ? `<text class="endlabel" x="${C.w - C.pr + 6}" y="${y(adopt[lastI]) - 6}" fill="var(--amber)">${f1(adopt[lastI])}%</text>` : ''}
    ${gen[lastI] != null ? `<text class="endlabel" x="${C.w - C.pr + 6}" y="${y(gen[lastI]) + 12}" fill="var(--info)">${f1(gen[lastI])}%</text>` : ''}
    <line id="cross" x1="0" y1="${C.pt}" x2="0" y2="${C.pt + ih}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3" opacity="0"/>
    <g id="hits">${hover}</g>
  </svg>`;
}
const isIn = (v, lo, hi) => v >= lo && v <= hi;

function renderDrill() {

  const sel = window.__drillShop && shops.indexOf(window.__drillShop) >= 0 ? window.__drillShop : shops[0];
  window.__drillShop = sel;
  const recs = store.list('metrics').filter(m => m.shop === sel).sort((a, b) => a.date < b.date ? 1 : -1);
  const last = recs[0];
  const T = store.cfg.targets;

  const m = METRICS.map(def => {
    const v = last ? num(last[def.k]) : null;
    const tgt = def.tgt ? T[def.tgt] : null;
    let color = '';
    if (v != null && tgt != null) color = (def.hi ? v < tgt : v > tgt) ? 'color:var(--bad)' : 'color:var(--good)';
    return `<div><div class="v" style="${color}">${v == null ? '—' : f1(v) + '%'}</div><div class="l">${def.l}${tgt != null ? ' · 目标 ' + tgt : ''}</div></div>`;
  }).join('');

  const spark = recs.slice(0, store.cfg.range).reverse();
  const sp = spark.length > 1 ? (() => {
    const vals = spark.map(r => num(r.adopt)).filter(v => v != null);
    if (!vals.length) return '';
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const w = 220, h = 34;
    const pts = spark.map((r, i) => {
      const v = num(r.adopt); if (v == null) return null;
      const px = (i / (spark.length - 1)) * w;
      const py = hi === lo ? h / 2 : h - ((v - lo) / (hi - lo)) * h;
      return `${px.toFixed(1)},${py.toFixed(1)}`;
    }).filter(Boolean).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:220px;height:34px;display:block" aria-hidden="true">
      <polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="1.6"/></svg>`;
  })() : '';

  const breach = agg.breaches().filter(b => b.shop === sel);

  box.innerHTML = `

      <div class="seg" id="drillTabs">
        ${shops.length > 10
          ? `<select id="drillSel" style="min-width:220px">${shops.map(s => `<option ${s === sel ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>`
          : shops.map(s => `<button data-drill="${esc(s)}" class="${s === sel ? 'on' : ''}">${esc(s)}</button>`).join('')}
      </div>
    </div>
    ${last ? `
    <div class="mini-kpis four">${m}</div>
    <div style="display:flex;align-items:center;gap:14px;margin:14px 0 8px;flex-wrap:wrap">
      <div class="block-title" style="margin:0;flex:1">采纳率近 ${spark.length} 天</div>
      ${sp}
      <span style="font-family:var(--mono);font-size:11px;color:var(--ink3)">最新记录 ${esc(last.date)}</span>
      <button class="btn sm" data-new="metrics">补录</button>
    </div>
    ${breach.length ? table([{ t: '未达标指标' }, { t: '当前', n: 1 }, { t: '目标', n: 1 }, { t: '差值', n: 1 }],
      breach.map(b => [b.metric, { html: f1(b.v) }, b.tgt, { html: `<span class="delta ${b.gap < 0 ? 'down' : 'up'}">${b.gap > 0 ? '+' : ''}${b.gap} pt</span>` }]))
      : `<div class="note" style="color:var(--good)">该店所有设目标指标均已达标</div>`}
    ` : emptyBlock('该店还没有指标记录', '导入或录入后显示', 'metrics', '录入指标')}`;
}

function renderStores() {
  const shops = store.list('shops');

  const st = uiState();

  const f = window.__storeFilter || 'all';
  const q = (window.__storeQ || '').trim().toLowerCase();

  const acctsOf = s => acctMap[s.name] || [];
  const hasAcct = s => acctsOf(s).length > 0;
  const hasOwner = s => !!(s.owner || '').trim();

  /* 店铺库只看「店 + 账号」口径，不参与采纳率等经营指标判定 */
  const statusOf = s => {
    if (s.tag === '历史' || s.opstat === '已下架') return { t: '已下架', c: 'mute' };
    if (s.auth === '未授权' || s.auth === '已失效') return { t: s.auth, c: 'p1' };
    if (!hasOwner(s)) return { t: '缺负责人', c: 'p1' };
    if (!hasAcct(s)) return { t: '缺账号', c: 'p1' };
    return { t: '正常', c: 'ok' };
  };

  const sorted = shops.slice().sort((a, b) => {
    const oa = a.order == null || a.order === '' ? 9999 : +a.order;
    const ob = b.order == null || b.order === '' ? 9999 : +b.order;
    return oa !== ob ? oa - ob : String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
  });

  const list = sorted.filter(s => {
    if (f === 'key' && s.tag !== '重点') return false;
    if (f === 'history' && s.tag !== '历史') return false;
    if (f === 'live' && s.tag === '历史') return false;
    if (f === 'noacct' && hasAcct(s)) return false;
    if (f === 'noowner' && hasOwner(s)) return false;
    if (q) {
      const hay = [s.name, s.platform, s.owner, s.binder, acctsOf(s).map(a => a.login || '').join(' ')]
        .join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;

  });

  const groups = {};
  list.forEach(s => { const p = s.platform || '其他'; (groups[p] = groups[p] || []).push(s); });

    const ia = PLAT_ORDER.indexOf(a), ib = PLAT_ORDER.indexOf(b);
    return ((ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)) || a.localeCompare(b, 'zh-Hans-CN');
  });

  const forceOpen = !!q || f !== 'all';
  const anyOpen = Object.keys(st.open).some(k => st.open[k]);

  const rowsOf = items => items.map(s => {
    const stt = statusOf(s);
    const accts = acctsOf(s);
    const open = !!st.acctOpen[s.name];
    let out = `<tr class="srow${open ? ' is-open' : ''}">
      <td class="s-name">
        <button type="button" class="s-toggle" data-acct="${esc(s.name)}" aria-expanded="${open}">
          <span class="caret">${ICON.chev}</span><span class="nm">${esc(s.name)}</span>
          ${s.tag === '重点' ? '<span class="chip amber">重点</span>' : ''}
          ${s.tag === '历史' ? `<span class="chip mute" title="${esc(s.note || '')}">历史</span>` : ''}
        </button>
        ${accts.length ? `<span class="acct-flag">账号 ${accts.length}</span>` : ''}
      </td>
      <td>${chipP(stt.t, stt.c)}</td>
      <td>${hasOwner(s) ? esc(s.owner) : chipP('待分配', 'p1')}</td>
      <td>${s.binder ? esc(s.binder) : '<span class="dim">—</span>'}</td>
      <td class="n mono">${accts.length ? '<b style="font-weight:500">' + accts.length + '</b>' : '<span class="dim">—</span>'}</td>
      <td class="n">${acts('shops', s.id)}</td>
    </tr>`;
    if (open) out += `<tr class="acct-detail"><td colspan="6">${acctPanel(s, accts)}</td></tr>`;
    return out;
  }).join('');

  const body = gKeys.map(p => {
    const items = groups[p];
    const kc = items.filter(s => s.tag === '重点').length;
    const rc = items.filter(hasAcct).length;
    const missAcct = items.filter(s => !hasAcct(s)).length;
    const open = forceOpen || !!st.open[p];
    return `<section class="sgroup${open ? ' open' : ''}" data-platform="${esc(p)}">
      <div class="sg-head" data-group="${esc(p)}" role="button" tabindex="0" aria-expanded="${open}">
        <span class="sg-caret">${ICON.chev}</span>
        <span class="sg-name">${esc(p)}</span>
        <span class="sg-meta">
          <span class="sg-pill">${items.length} 家</span>
          ${kc ? `<span class="sg-pill key">重点 ${kc}</span>` : ''}
          <span class="sg-pill">已建账号 ${rc}</span>
          ${missAcct ? `<span class="sg-pill warn">缺账号 ${missAcct}</span>` : ''}
        </span>
      </div>
      <div class="sg-body">
        <div class="tbl-wrap"><table class="store-tbl">
          <thead><tr><th>店铺</th><th>状态</th><th>负责人</th><th>绑定人</th><th class="n">账号</th><th></th></tr></thead>
          <tbody>${rowsOf(items)}</tbody>
        </table></div>
      </div>
    </section>`;
  }).join('');

  const total = shops.length;
  const histN = shops.filter(s => s.tag === '历史').length;
  const liveN = total - histN;
  const liveShops = shops.filter(s => s.tag !== '历史');
  const keyN = liveShops.filter(s => s.tag === '重点').length;
  const noAcctN = liveShops.filter(s => !hasAcct(s)).length;
  const noOwnerN = liveShops.filter(s => !hasOwner(s)).length;
  /* 缺口按平台拆开，一眼看出是「某平台整体未接入」还是个别漏填 */
  const mixBy = pred => {
    const m = {};
    liveShops.filter(pred).forEach(s => { const p = s.platform || '其他'; m[p] = (m[p] || 0) + 1; });
    return Object.keys(m)
      .sort((a, b) => ((PLAT_ORDER.indexOf(a) < 0 ? 99 : PLAT_ORDER.indexOf(a)) - (PLAT_ORDER.indexOf(b) < 0 ? 99 : PLAT_ORDER.indexOf(b))))
      .map(p => `${p} ${m[p]}`).join(' · ');
  };
  const noOwnerMix = mixBy(s => !hasOwner(s));
  const noAcctMix = mixBy(s => !hasAcct(s));
  const acctAll = store.list('accounts');
  const acctN = acctAll.length;
  const acctStopN = acctAll.filter(a => a.status === '停用').length;

  const tabs = [
    { k: 'all', l: '全部', n: total },
    { k: 'live', l: '在营', n: liveN },
    { k: 'key', l: '重点', n: keyN },
    { k: 'history', l: '历史/关店', n: histN },
    { k: 'noacct', l: '缺账号', n: noAcctN },
    { k: 'noowner', l: '缺负责人', n: noOwnerN }
  ];

  const owners = agg.owners().map(o => {
    const own = shops.filter(s => s.owner === o);
    const ownLive = own.filter(s => s.tag !== '历史');
    const tasks = store.list('tasks').filter(t => t.owner === o && t.status !== '已完成').length;
    return `<div class="owner">
      <div class="hd"><div class="av">${esc(o.slice(0, 1))}</div>
        <div><div class="nm">${esc(o)}</div><div class="rl">负责店铺</div></div></div>
      <div class="row2">
        <div><span>${own.length}</span><em>家店</em></div>
        <div><span>${own.filter(s => s.tag === '重点').length}</span><em>重点</em></div>
        <div><span>${ownLive.filter(s => !hasAcct(s)).length}</span><em>缺账号</em></div>
        <div><span>${tasks}</span><em>待办</em></div>
      </div></div>`;
  }).join('');

  return `
  <div class="sec-head">
    <h2>店铺库</h2>
    <span class="sub">${liveN} 家在营 · ${histN} 家历史/关店 · 账号 ${acctN} 条 · 缺账号 ${noAcctN} · 缺负责人 ${noOwnerN}</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn" data-go="assets">资产库 ${store.list('assets').length} 份 →</button>
      <button class="btn primary" data-new="shops">${ICON.plus} 新增店铺</button>
    </div>
  </div>

  <div class="vault">
    <div class="vault-l">
      <span class="vault-ic">${ICON.lock}</span>
      <div>
        <b>账号信息 · 只记绑定人与尾号</b>
        <span class="vault-t">${acctN} 条账号 · ${acctStopN} 条已停用。工作台不再保存登录密码，账号名下只留绑定人与其手机号后四位，团队共用时可对照核对。</span>
      </div>
    </div>
    <div class="vault-r">
      <button class="btn sm" data-new="accounts">${ICON.plus} 补一条账号</button>
    </div>
  </div>

  <div class="store-stats">
    <div class="ss"><em>在营店铺</em><b>${liveN}</b><i>${gKeys.length} 个平台 · 历史 ${histN}</i></div>
    <div class="ss"><em>重点店铺</em><b>${keyN}</b><i>需重点跟进</i></div>
    <div class="ss"><em>账号总数</em><b>${acctN}</b><i>覆盖 ${Object.keys(acctMap).length} 家店</i></div>
    <div class="ss ${noAcctN ? 'warn' : ''}"><em>缺账号</em><b>${noAcctN}</b><i>${noAcctMix || '登录信息待补'}</i></div>
    <div class="ss ${noOwnerN ? 'warn' : ''}"><em>缺负责人</em><b>${noOwnerN}</b><i>${noOwnerMix || '待指派'}</i></div>
  </div>

  <div class="toolbar">
    <div class="seg" id="storeTabs">
      ${tabs.map(t => `<button data-f="${t.k}" class="${f === t.k ? 'on' : ''}">${t.l}<b>${t.n}</b></button>`).join('')}
    </div>
    <label class="search">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input id="storeSearch" placeholder="搜索店铺 / 负责人 / 账号" value="${esc(window.__storeQ || '')}" />
    </label>
    ${forceOpen ? '' : `<button class="btn sm" data-expand="${anyOpen ? 'none' : 'all'}">${anyOpen ? '收起全部' : '展开全部'}</button>`}
    <div style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)">显示 ${list.length} / ${total} 家</div>
  </div>

  ${gKeys.length ? body : emptyBlock('没有匹配的店铺', '换个关键词或筛选条件试试')}

  <div class="block-title" style="margin-top:26px">负责人聚合 · ${agg.owners().length} 位</div>
  <div class="owners">${owners || emptyBlock('还没有负责人', '编辑店铺时填写负责人')}</div>`;
}

/* ---------- 页面：资产库 ---------- */
const ASSET_TYPES = ['话术模板', '知识切片', '词表', '配置', '业务流程', 'AI 技能', '其他'];

function renderAssets() {
  const all = store.list('assets');
  const f = window.__assetF || 'all';
  const q = (window.__assetQ || '').trim().toLowerCase();

  const cnt = t => all.filter(a => (a.type || '其他') === t).length;
  const byState = s => all.filter(a => (a.status || '草稿') === s).length;
  const live = byState('已生效'), draft = byState('草稿'), arch = byState('已归档');

  let list = all.slice();
  if (f !== 'all') list = list.filter(a => (a.type || '其他') === f);
  if (q) list = list.filter(a => [a.name, a.type, a.cat, a.shop, a.owner, a.note, a.url]
    .join(' ').toLowerCase().indexOf(q) >= 0);

  const tabs = [{ k: 'all', l: '全部', n: all.length }]
    .concat(ASSET_TYPES.map(t => ({ k: t, l: t, n: cnt(t) })).filter(x => x.n));

  const rows = list.map(a => [
    { html: `<span style="font-weight:500">${esc(a.name)}</span>
      ${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener" style="margin-left:6px;font-size:10.5px;color:var(--amber)">打开 ↗</a>` : ''}
      ${a.note ? `<div style="font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.5">${esc(a.note)}</div>` : ''}` },
    { html: chipP(a.type || '其他', a.type === '业务流程' ? 'amber' : a.type === 'AI 技能' ? 'ok' : 'mute') },
    { html: `<span style="color:var(--ink2)">${esc(a.cat || '—')}</span>` },
    { html: `<span style="font-family:var(--mono);font-size:11.5px">${esc(a.shop || '—')}</span>` },
    { html: `<span style="color:var(--ink2)">${esc(a.owner || '—')}</span>` },
    { html: `<span style="font-family:var(--mono);font-size:11.5px;color:var(--ink3)">${esc(a.date || '—')}</span>` },
    { html: stChip(a.status || '草稿') },
    { html: acts('assets', a.id) }
  ]);

  const steps = [
    { ix: '01', nm: '登记', ds: '新建资产默认草稿，只有登记人与负责人可见', n: all.length, u: '份已登记' },
    { ix: '02', nm: '评审', ds: '负责人核对口径与话术，冲突项退回重写', n: draft, u: '份待评审' },
    { ix: '03', nm: '生效', ds: '生效后自动挂到关联店铺的回复与质检链路', n: live, u: '份生效中' },
    { ix: '04', nm: '归档', ds: '过期或换版后留档，不再参与调用', n: arch, u: '份已归档' }
  ];

  return `
  <div class="sec-head">
    <h2>资产库</h2>
    <span class="sub">${all.length} 份资产 · 已生效 ${live} · 草稿 ${draft} · ${new Set(all.map(a => a.owner).filter(Boolean)).size} 位负责人</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn primary" data-new="assets">${ICON.plus} 新增资产</button>
    </div>
  </div>

  <div class="mini-kpis four">
    <div><div class="v">${all.length}</div><div class="l">资产总数</div></div>
    <div><div class="v" style="color:var(--good)">${live}</div><div class="l">已生效</div></div>
    <div><div class="v" style="color:var(--warn)">${draft}</div><div class="l">草稿待评审</div></div>
    <div><div class="v" style="color:var(--ink3)">${arch}</div><div class="l">已归档</div></div>
  </div>

  <div class="toolbar" style="margin-top:14px">
    <div class="seg" id="assetTabs">
      ${tabs.map(t => `<button data-f="${esc(t.k)}" class="${f === t.k ? 'on' : ''}">${esc(t.l)}<b>${t.n}</b></button>`).join('')}
    </div>
    <label class="search">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
      <input id="assetSearch" placeholder="搜索资产 / 分类 / 店铺 / 负责人" value="${esc(window.__assetQ || '')}" />
    </label>
    <div style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)">显示 ${list.length} / ${all.length} 份</div>
  </div>

  ${table([{ t: '资产' }, { t: '类型' }, { t: '分类' }, { t: '关联店铺' }, { t: '负责人' }, { t: '更新' }, { t: '状态' }, { t: '' }],
