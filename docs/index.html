  <div class="block-title" style="margin-top:26px">资产全流程</div>
  <div class="flow">
    ${steps.map(s => `<div>
      <div class="st">${s.ix}</div>
      <div class="nm">${s.nm}</div>
      <div class="ds">${s.ds}</div>
      <div class="ds" style="margin-top:8px;color:var(--ink2);font-family:var(--mono)">${s.n} ${s.u}</div>
    </div>`).join('')}
  </div>`;
}

function bindAssets() {
  const tabs = $('#assetTabs');
  if (tabs) tabs.addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    window.__assetF = b.dataset.f; render();
  });
  const q = $('#assetSearch');
  if (q) q.addEventListener('input', () => {
    window.__assetQ = q.value;
    clearTimeout(window.__assetTimer);
    window.__assetTimer = setTimeout(render, 220);
  });
}

/* ---------- 页面：协同任务 ---------- */
function renderTasks() {
  const tasks = store.list('tasks');
  const cols = [
    { k: '待办', cls: '' },
    { k: '进行中', cls: 'doing' },
    { k: '已完成', cls: 'done' }
  ];
  const card = t => `<div class="tcard ${t.status === '已完成' ? 'done' : ''}">
    <div class="tt">${esc(t.title || '(无标题)')}</div>
    <div class="tf">
      ${t.prio ? lvlChip(t.prio) : chipOk('已完成')}
      <span class="who">${esc(t.owner || '—')}</span>
      <span class="when ${t.due && t.due < todayStr() && t.status !== '已完成' ? 'late' : ''}">${esc(t.due ? t.due.slice(5) : '—')}</span>
      ${acts('tasks', t.id, t.status !== '已完成' ? { done: 1, doneLabel: '标记已完成' } : {})}
    </div>
  </div>`;

  const board = cols.map(c => {
    const arr = tasks.filter(t => (t.status || '待办') === c.k);
    return `<div class="col ${c.cls}">
      <div class="col-hd"><span class="dot"></span><span class="nm">${c.k}</span><span class="ct">${arr.length}</span></div>
      ${arr.length ? arr.map(card).join('') : `<div style="padding:14px 4px;font-size:11px;color:var(--ink3);text-align:center">暂无</div>`}
    </div>`;
  }).join('');

  return `
  <div class="sec-head">
    <h2>协同与任务</h2>
    <span class="sub">待办 ${tasks.filter(t => t.status === '待办' || !t.status).length} ·
      进行中 ${tasks.filter(t => t.status === '进行中').length} ·
      已完成 ${tasks.filter(t => t.status === '已完成').length}</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn primary" data-new="tasks">${ICON.plus} 新增任务</button>
    </div>
  </div>
  <div class="kanban">${board}</div>

  <div class="block-title" style="margin-top:26px">任务清单</div>
  ${table([{ t: '标题' }, { t: '负责人' }, { t: '优先级' }, { t: '状态' }, { t: '截止' }, { t: '类型' }, { t: '' }],
    tasks.map(t => [
      { html: `<span style="font-weight:500">${esc(t.title || '')}</span>` },
      t.owner || '—',
      { html: lvlChip(t.prio || 'P2') },
      { html: stChip(t.status || '待办') },
      { html: `<span style="font-family:var(--mono);font-size:11.5px">${esc(t.due || '—')}</span>` },
      { html: `<span style="color:var(--ink2)">${esc(t.type || '—')}</span>` },
      { html: acts('tasks', t.id, t.status !== '已完成' ? { done: 1 } : {}) }
    ]), '还没有任务')}`;
}

/* ---------- 页面：质检风控 ---------- */
function renderQc() {
  const qc = store.list('qc');
  const active = qc.filter(q => q.status === '生效中').length;
  const pend = qc.filter(q => q.status === '待复核').length;
  const hits = sum(qc.map(q => num(q.hits) || 0));
  const conflicts = qc.filter(q => q.type === '口径冲突');

  return `
  <div class="sec-head">
    <h2>质检风控与设置</h2>
    <span class="sub">${active} 条生效 · ${pend} 条待复核 · 近 7 天命中 ${hits}</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn primary" data-new="qc">${ICON.plus} 新增规则</button>
    </div>
  </div>

  <div class="mini-kpis">
    <div><div class="v" style="color:var(--good)">${active}</div><div class="l">生效中规则</div></div>
    <div><div class="v" style="color:var(--warn)">${pend}</div><div class="l">待复核</div></div>
    <div><div class="v">${hits}</div><div class="l">命中总数</div></div>
  </div>

  <div class="block-title" style="margin-top:24px">规则清单</div>
  ${table([{ t: '规则' }, { t: '类型' }, { t: '适用' }, { t: '阈值' }, { t: '级别' }, { t: '命中', n: 1 }, { t: '状态' }, { t: '' }],
    qc.map(q => [
      { html: `<span style="font-weight:500">${esc(q.name)}</span>` },
      { html: `<span style="color:var(--ink2)">${esc(q.type || '—')}</span>` },
      { html: `<span style="font-family:var(--mono);font-size:11.5px">${esc(q.shop || '—')}</span>` },
      q.threshold || '—',
      { html: chipP(q.level || '中', q.level === '高' ? 'p0' : q.level === '中' ? 'p1' : 'mute') },
      q.hits == null ? '—' : q.hits,
      { html: stChip(q.status || '生效中') },
      { html: acts('qc', q.id) }
    ]), '还没有质检规则')}

  ${conflicts.length ? `<div class="block-title" style="margin-top:24px">口径冲突 · 待裁决</div>
  ${table([{ t: '冲突项' }, { t: '说明' }, { t: '适用' }, { t: '状态' }, { t: '' }],
    conflicts.map(q => [
      { html: `<span style="font-weight:500">${esc(q.name)}</span>` },
      { html: `<span style="color:var(--ink2)">${esc(q.note || '—')}</span>` },
      { html: `<span style="font-family:var(--mono)">${esc(q.shop || '—')}</span>` },
      { html: stChip(q.status || '待复核') },
      { html: acts('qc', q.id) }
    ]))}
  <div class="note">口径冲突不裁决，模型会同时学到两套说法，是采纳率波动的隐性来源之一。</div>` : ''}`;
}

/* ---------- 页面：AI 接口 ---------- */
function renderApi() {
  const apis = store.list('apis');
  const calls = sum(apis.map(a => num(a.calls) || 0));
  const errs = sum(apis.map(a => num(a.errors) || 0));
  const down = apis.filter(a => a.status !== '正常').length;
  const okRate = calls ? ((calls - errs) / calls * 100) : null;

  return `
  <div class="sec-head">
    <h2>AI 接口</h2>
    <span class="sub">${apis.length} 个模型 / 接口 · 今日 ${calls} 次调用 · 异常 ${errs}</span>
    <div class="head-actions" style="margin-left:auto">
      <button class="btn primary" data-new="apis">${ICON.plus} 新增接口</button>
    </div>
  </div>

  <div class="mini-kpis">
    <div><div class="v" style="color:${down ? 'var(--bad)' : 'var(--good)'}">${okRate == null ? '—' : f1(okRate)}${okRate == null ? '' : '<small>%</small>'}</div><div class="l">成功率</div></div>
    <div><div class="v">${calls}</div><div class="l">今日调用</div></div>
    <div><div class="v" style="color:${down ? 'var(--bad)' : ''}">${down}</div><div class="l">异常接口</div></div>
  </div>

  <div class="block-title" style="margin-top:24px">接入清单</div>
  ${table([{ t: '名称' }, { t: '用途' }, { t: '通道' }, { t: '今日调用', n: 1 }, { t: '异常', n: 1 }, { t: '负责人' }, { t: '状态' }, { t: '' }],
    apis.map(a => [
      { html: `<span style="font-weight:500">${esc(a.name)}</span>` },
      { html: `<span style="color:var(--ink2)">${esc(a.type || '—')}</span>` },
      { html: chipP(a.endpoint || '—', 'p2') },
      a.calls == null ? '—' : a.calls,
      a.errors == null ? '—' : a.errors,
      a.owner || '—',
      { html: stChip(a.status || '正常') },
      { html: acts('apis', a.id) }
    ]), '还没有接入记录')}`;
}

/* 导航右侧挂件：数字 / 琥珀点 / 待接入小字，默认隐藏，hover·focus 才现 */
function navMeta() {
  const put = (id, val) => {
    const n = document.querySelector(`[data-meta="${id}"]`);
    if (!n) return;
    if (val === true) { n.innerHTML = '<i class="dot"></i>'; n.title = '有待办'; }
    else if (val) { n.textContent = val; }
  };
  const live = store.list('shops').filter(s => s.tag !== '历史').length;
  const assets = store.list('assets').length;
  const todo = store.list('tasks').filter(t => t.status !== '已完成').length;
  put('stores', live);
  put('assets', assets);
  put('tasks', todo);
  put('api', '待接入');
}

function renderNav() {
  const el2 = $('#nav');
  if (!el2) return;
  const groups = [];
  PAGES.forEach(p => {
    const g = groups.find(x => x.t === p.grp);
    (g || groups[groups.push({ t: p.grp, items: [] }) - 1]).items.push(p);
  });
  el2.innerHTML = groups.map(g =>
    `<div class="nav-grp-t">${esc(g.t)}</div>` +
    g.items.map(p => `<button type="button" data-go="${p.id}">
        <span class="ic">${NAV_ICON[p.id] || ''}</span>
        <span class="lb">${esc(p.name)}</span>
        <span class="meta" data-meta="${p.id}"></span>
      </button>`).join('')
  ).join('');
  navMeta();
}

/* 单个绝对定位块承载选中态：读选中项 rect → 写 transform / width / height */
function moveGlide() {
  const g = $('#navGlide'), inner = $('#railInner');
  if (!g || !inner) return;
  const cur = $('#nav button.on');
  if (!cur) { g.style.opacity = '0'; return; }
  const ib = inner.getBoundingClientRect();
  const cb = cur.getBoundingClientRect();
  g.style.width = cb.width + 'px';
  g.style.height = cb.height + 'px';
  g.style.transform = `translate3d(${cb.left - ib.left}px, ${cb.top - ib.top}px, 0)`;
}

function setDrawer(open) {
  const rail = document.getElementById('rail');
  const mask = document.getElementById('railMask');
  const burger = document.getElementById('railBurger');
  if (!rail) return;
  rail.dataset.open = open ? 'true' : 'false';
  if (mask) mask.dataset.on = open ? 'true' : 'false';
  if (burger) burger.setAttribute('aria-expanded', open ? 'true' : 'false');
}

function go(id) {
  if (!RENDER[id]) id = 'signal';
  window.__page = id;
  $$('#nav button').forEach(b => {
    const on = b.dataset.go === id;
    b.classList.toggle('on', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const p = PAGES.find(x => x.id === id);
  $('#crumb').innerHTML = `工作台 <i>/</i> <b>${p.name}</b>`;
  $('#viewport').scrollTop = 0;
  render();
  moveGlide();
  setDrawer(false);
}

function render() {
  if (window.__rendering) return;
  window.__rendering = true;
  try {
    const ae = document.activeElement;
    if (ae && ae !== document.body && typeof ae.blur === 'function') ae.blur();
    const id = window.__page || 'signal';
    const seedBar = (store.db.meta && store.db.meta.seed)
      ? `<div class="seed-bar"><span><b>团队共享数据</b>　${store.list('shops').length} 家店铺 · ${store.list('accounts').length} 条账号 · ${store.list('metrics').length} 条指标记录。${store.cloudErr ? '云端暂未接通，改动先存在本机，恢复后自动补传。' : '业务数据和目标值都存在团队云端，谁改所有人都生效，约 1 分钟内自动同步（切回本页会立刻同步）。'}</span></div>` : '';
    $('#viewport').innerHTML = `<div class="view on">${seedBar}${RENDER[id]()}</div>`;
    if (id === 'board') { renderDrill(); bindChart(); }
    if (id === 'stores') bindStores();
    if (id === 'assets') bindAssets();
    updateFoot();
  } finally {
    window.__rendering = false;
  }
}

function updateFoot() {
  /* 侧栏底部改为用户卡后，这里只负责刷新导航挂件的数字 */
  navMeta();
}

/* ---------- 图表交互 ---------- */
function bindChart() {
  const wrap = $('#chartWrap'); if (!wrap) return;
  const svg = wrap.querySelector('svg.chart'); if (!svg) return;
  const tip = $('#tip'), cross = svg.querySelector('#cross');
  if (!tip || !cross) return;
  const iw = C.w - C.pl - C.pr;
  const show = (i, px, py) => {
    const d = chartData[i]; if (!d) return;
    const cx = C.pl + (chartData.length === 1 ? iw / 2 : (iw / (chartData.length - 1)) * i);
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '1');
    tip.innerHTML = `<div class="hd">${esc(d.date)}</div>
      <div class="row"><em>采纳率</em><span style="color:var(--amber)">${f1(d.adopt)}%</span></div>
      <div class="row"><em>生成率</em><span style="color:var(--info)">${f1(d.gen)}%</span></div>
      <div class="row"><em>样本店</em><span>${d._n || 0}</span></div>`;
    const rect = svg.getBoundingClientRect();
    const left = (cx / C.w) * rect.width - wrap.scrollLeft;
    tip.style.left = Math.min(Math.max(left, 80), rect.width - 80) + 'px';
    const flip = py != null && py < 74;
    tip.style.top = (flip ? py + 14 : (py != null ? py - 12 : rect.height * 0.5)) + 'px';
    tip.style.transform = flip ? 'translate(-50%,0)' : 'translate(-50%,-100%)';
    tip.classList.add('on');
  };
  $$('.hv', svg).forEach(r => {
    const at = e => {
      const rect = svg.getBoundingClientRect();
      show(+r.dataset.i, e.clientX - rect.left, e.clientY - rect.top);
    };
    r.addEventListener('mouseenter', at);
    r.addEventListener('mousemove', at);
  });
  svg.addEventListener('mouseleave', () => {
    cross.setAttribute('opacity', '0');
    tip.classList.remove('on');
  });

  const ro = $('#readout');
  if (ro && chartData.length) {
    const first = chartData[0], last = chartData[chartData.length - 1];
    const dif = (last.adopt != null && first.adopt != null) ? (last.adopt - first.adopt) : null;
    ro.innerHTML = `区间内采纳率从 <b>${f1(first.adopt)}%</b> 到 <b>${f1(last.adopt)}%</b>${dif == null ? '' : `，净变化 <b>${dif > 0 ? '+' : ''}${f1(dif)} pt</b>`}；
      同期生成率 <b>${f1(first.gen)}%</b> → <b>${f1(last.gen)}%</b>。
      共 <b>${chartData.length}</b> 个数据日，最新一日 <b>${last._n || 0}</b> 家店有记录。`;
  }
}

function bindStores() {
  const tabs = $('#storeTabs');
  if (tabs) tabs.addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    window.__storeFilter = b.dataset.f; render();
  });
  const q = $('#storeSearch');
  if (q) {
    q.addEventListener('input', () => {
      window.__storeQ = q.value;
      clearTimeout(window.__qTimer);
      window.__qTimer = setTimeout(render, 220);
    });
  }
}

/* ---------- 全局事件 ---------- */
document.addEventListener('click', e => {
  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { go(goBtn.dataset.go); return; }

  /* 店铺库：平台分组折叠 */
  const grp = e.target.closest('[data-group]');
  if (grp) {
    const st = uiState(), p = grp.dataset.group;
    st.open[p] = !st.open[p];
    render(); return;
  }
  /* 店铺库：展开某店账号明细 */
  const acc = e.target.closest('[data-acct]');
  if (acc) {
    const st = uiState(), n = acc.dataset.acct;
    st.acctOpen[n] = !st.acctOpen[n];
    render(); return;
  }
  /* 店铺库：展开/收起全部平台 */
  const ex = e.target.closest('[data-expand]');
  if (ex) {
    const st = uiState();
    if (ex.dataset.expand === 'all') { PLAT_ORDER.forEach(p => { st.open[p] = true; }); }
    else { st.open = {}; }
    render(); return;
  }

  const nw = e.target.closest('[data-new]');
  if (nw) {
    const pre = {};
    if (nw.dataset.preShop) pre.shop = nw.dataset.preShop;
    openForm(nw.dataset.new, null, pre);
    return;
  }
  /* 表单：密码框显隐 */
  const eye = e.target.closest('[data-eye]');
  if (eye) {
    const inp = eye.parentNode.querySelector('input');
    if (inp) {
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      eye.classList.toggle('on', show);
    }
    return;
  }

  const ed = e.target.closest('[data-edit]');
  if (ed) { const a = ed.dataset.edit.split(':'); openForm(a[0], a[1]); return; }

  const dl = e.target.closest('[data-del]');
  if (dl) { const a = dl.dataset.del.split(':'); deleteRec(a[0], a[1]); return; }

  const dn = e.target.closest('[data-done]');
  if (dn) {
    const a = dn.dataset.done.split(':');
    const key = a[0], id = a[1];
    const rec = store.get(key, id);
    if (rec) {
      const next = key === 'alerts' ? '已处理' : key === 'tasks' ? '已完成' : rec.status;
      store.update(key, id, { status: next });
      toast('已更新为「' + next + '」', 'ok');
      render();
    }
    return;
  }

  const imp = e.target.closest('[data-import]');
  if (imp) { openImport(); return; }

  const cs = e.target.closest('[data-clear-seed]');
  if (cs) {
    confirmDialog('清空示例数据',
      '将删除全部店铺、指标、预警、任务、质检、资产与接口记录，且不可恢复。<br>若只想覆盖指标，直接点「导入指标」即可，不必清空。',
      () => { store.clearAll(); toast('已清空，可从零开始', 'ok'); window.__page = 'signal'; render(); },
      '确认清空');
    return;
  }

  const drill = e.target.closest('[data-drill]');
  if (drill) {
    window.__drillShop = drill.dataset.drill;
    $$('#drillTabs button').forEach(b => b.classList.toggle('on', b === drill));
    renderDrill();
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'drillSel') { window.__drillShop = e.target.value; renderDrill(); return; }
  const t = e.target.closest('[data-tgt]');
  if (t) {
    const v = num(t.value);
    if (v == null) { toast('目标值需为数字', 'bad'); return; }
    store.cfg.targets[t.dataset.tgt] = v;
    store.saveCfg(); toast('目标值已更新 · 已同步全组', 'ok'); render(); return;
  }
  const r = e.target.closest('[data-range]');
  if (r) { store.cfg.range = +r.value; store.saveCfg(); toast('统计周期已同步全组', 'ok'); render(); }
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= PAGES.length) go(PAGES[n - 1].id);
});

/* ---------- 主题 ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('sb-theme', t); } catch (e) {}
}
$('#theme').addEventListener('click', () => {
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
try { const s = localStorage.getItem('sb-theme'); setTheme(s || "light"); } catch (e) {}

/* =========================================================

   启动：打开即用 + 团队云端自动同步
   不再有登录门禁：链接发给谁，谁打开就能用；
   「我是谁」只记在本机，写库时带上名字，方便追溯是谁改的。
   ========================================================= */
const auth = {
  session: null,
  /* 不登录，身份就是一个本机名字 */
  async restore() {
    this.session = { user: { name: myName() } };
    return this.session;
  },
  rename(n) {
    const v = setMyName(n);
    this.session = { user: { name: v } };
    setUserCard();
    return v;
  }
};

function showLoading(text) {
  let el = $('#boot');
  if (!el) {
    el = document.createElement('div');
    el.id = 'boot';
    el.className = 'boot';
    el.innerHTML = `<div class="boot-card"><span class="boot-spin"></span><b id="bootTxt"></b></div>`;
    document.body.appendChild(el);
  }
  $('#bootTxt').textContent = text || '加载中…';
  el.classList.remove('bad');
}
function showFatal(text) {
  showLoading(text);
  const el = $('#boot');
  if (el) { el.classList.add('bad'); const s = el.querySelector('.boot-spin'); if (s) s.style.display = 'none'; }
}
function hideLoading() { const el = $('#boot'); if (el) el.remove(); }

/* 侧栏底部的「我」：名字 + 云端状态 */
function setUserCard() {
  const name = myName();
  const av = $('#uAv'), nm = $('#uName'), rl = $('#uRole');
  if (av) av.textContent = String(name).slice(0, 1);
  if (nm) nm.textContent = name;
  if (rl) {
    rl.textContent = !cloud
      ? '本机模式'
      : (store.cloudErr ? '未连云端 · 存本机' : '云端已同步');
  }
}

/* 填名字：只影响标记，不影响权限 */
function askName() {
  const cur = myName();
  openModal({
    title: '我是谁',
    body: `<div style="font-size:12.5px;line-height:1.8;color:var(--ink2);margin-bottom:10px">填个名字，你改的店铺、账号、指标、任务会记上这个名字，组里一眼看出是谁动的。名字只存在你这台设备上，不会上传。</div>
      <input id="meInp" maxlength="12" placeholder="例如：王涛" value="${esc(cur === '组内成员' ? '' : cur)}"
        style="width:100%;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;outline:none" />`,
    buttons: [
      { label: '取消', cls: 'ghost' },
      { label: '保存', cls: 'primary', fn: c => {
        const v = auth.rename(($('#meInp') || {}).value);
        c();
        toast('已记住：' + v, 'ok');
      } }
    ]
  });
  setTimeout(() => { const i = $('#meInp'); if (i) { i.focus(); i.select(); } }, 160);
}

/* 拉取同事的最新改动：无弹窗、无正在编辑的输入、无待写入时才做，避免冲掉手上的内容 */
async function pullLatest(silent) {
  if (!cloud || store._flushing) return false;
  if (Date.now() - (store._lastWrite || 0) < 2000) return false;
  if (document.querySelector('.modal-bd')) return false;
  const ae = document.activeElement;
  if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return false;
  const snap = JSON.stringify(store.db) + '|' + JSON.stringify(store.cfg);
  try { await store.hydrate({ noSeed: true }); } catch (e) { return false; }
  if (snap === JSON.stringify(store.db) + '|' + JSON.stringify(store.cfg)) return false;
  if (!store.cloudErr) hideCloudNotice();
  render();
  setUserCard();
  if (!silent) toast('已同步同事的最新改动', 'ok');
  return true;
}

/* 云端未就绪时的常驻提示条（最常见：数据表还没在 Supabase 建） */
function cloudNotice(msg, retry) {
  let el = document.getElementById('cloudNotice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'cloudNotice';
    el.style.cssText = [
      'position:fixed', 'left:50%', 'top:12px', 'transform:translateX(-50%)', 'z-index:120',
      'display:flex', 'align-items:center', 'gap:10px', 'max-width:min(760px,92vw)',
      'padding:9px 12px', 'border-radius:10px', 'font-size:12.5px', 'line-height:1.55',
      'background:var(--warn-soft)', 'color:var(--warn)', 'border:1px solid var(--warn)',
      'box-shadow:0 8px 24px -12px rgba(10,26,32,.45)'
    ].join(';');
    document.body.appendChild(el);
  }
  el.innerHTML = `<span style="flex:1">${esc(msg)}</span>`;
  if (retry) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = '已建好，重试';
    b.style.cssText = 'height:26px;padding:0 10px;font-size:12px;white-space:nowrap';
    b.addEventListener('click', retry);
    el.appendChild(b);
  }
  return el;
}
function hideCloudNotice() {
  const el = document.getElementById('cloudNotice');
  if (el) el.remove();
}
/* 按当前错误状态决定提示内容：建表类问题给「重试」，网络问题只告知 */
function syncNotice() {
  if (!store.cloudErr) { hideCloudNotice(); return; }
  const needSql = /PGRST205|42P01|Could not find the table|schema cache/i.test(store.cloudErr);
  cloudNotice(
    needSql
      ? '云端已连上，但数据表还没建：把 supabase/schema.sql 在 Supabase 的 SQL Editor 跑一次，再点右边重试。在那之前，改动只存在你这台电脑上。'
      : '云端暂时连不上（' + store.cloudErr + '），改动先存在本机，恢复后打开页面会自动补传。',
    needSql ? retryCloud : null
  );
}
async function retryCloud() {
  hideCloudNotice();
  store.cloudErr = '';
  try { await store.hydrate(); } catch (e) { store.cloudErr = (e && e.message) || String(e); }
  setUserCard();
  render();
  if (store.cloudErr) syncNotice();
  else toast('云端已接通，团队数据已同步', 'ok');
}

/* 同步数据 → 起界面。云端挂了也照常进，先跑本机缓存 */
async function enterApp() {
  store.session = auth.session;
  showLoading('正在同步团队数据…');
  let r = null;
  try { r = await store.hydrate(); }
  catch (e) { r = null; store.cloudErr = (e && e.message) || String(e); }
  hideLoading();
  setUserCard();
  startApp();
  syncNotice();
  if (r && r.seeded) toast('已初始化团队数据 · ' + r.rows + ' 条记录', 'ok');
}

function startApp() {
  if (window.__started) return;
  window.__started = true;
  renderNav();
  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go);
  });

  /* 移动端抽屉（≤920px），顶栏汉堡唤起 */
  const railEl = $('#rail');
  if (railEl) {
    railEl.classList.add('no-anim');
    const burger = $('#railBurger'), mask = $('#railMask');
    if (burger) burger.addEventListener('click', () => setDrawer(true));
    if (mask) mask.addEventListener('click', () => setDrawer(false));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });
  }

  const out = $('#uOut');
  if (out) out.addEventListener('click', () => askName());

  go('signal');

  /* 团队协作：每 60 秒与云端对一次，切回标签页时立刻对一次 */
  setInterval(() => { if (!document.hidden) pullLatest(false); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullLatest(true); });

  /* 首帧先无动画落位，下一帧再淡入并恢复过渡，避免滑块从左上方飞入 */
  requestAnimationFrame(() => {
    moveGlide();
    requestAnimationFrame(() => {
      if (railEl) { railEl.classList.remove('no-anim'); railEl.classList.add('is-ready'); }
    });
  });
  window.addEventListener('resize', () => moveGlide());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveGlide());
}

/* ---------- init ---------- */
